                <button onClick={() => navigateTo('search')} className="hidden sm:flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium text-sm transition-all hover:scale-105 focus-ring" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>

    const JobCard = ({ job, onApply }) => {

      const submitApplication = async (e) => {
        e.preventDefault(); setLoading(true);

                  <div><label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Place/Location</label><input required name="place" value={formData.place} onChange={e => setFormData({ ...formData, place: e.target.value })} type="text" className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} /></div>

                </div>
              </form>
            )}
          </div>
        </div>
      );
    };

    const AdvertiseJobModal = ({ onClose }) => {
      const { formatPrice, trackSubmission } = useApp();
      const [step, setStep] = useState(1);
      const [jobInfo, setJobInfo] = useState({ title: '', description: '', company: '', location: '', salary: '', image: '' });
      const [advertiserInfo, setAdvertiserInfo] = useState({ name: '', phone: '' });
      const [payment, setPayment] = useState({ provider: 'mtn', transactionId: '' });
      const [loading, setLoading] = useState(false);

      const submitAd = async (e) => {
        e.preventDefault();
        setLoading(true);

        const newJobRequest = {
          _id: 'job_req_' + Date.now(),
          advertiserName: advertiserInfo.name,
          advertiserPhone: advertiserInfo.phone,
          transactionId: payment.transactionId,
          amountPaid: 100,
          paymentDate: new Date(),
          jobData: {
            title: jobInfo.title,
            company: jobInfo.company,
            location: jobInfo.location || 'Remote',
            salary: jobInfo.salary || 'Negotiable',
            type: 'Full-time',
            description: jobInfo.description,
            image: jobInfo.image || 'https://images.unsplash.com/photo-1497215728101-856f4ea42174?w=800',
            featured: false
          }
        };

        const result = await api.submitPendingJob(newJobRequest);

        setLoading(false);
        if (result.success) {
          trackSubmission(newJobRequest._id, 'job', newJobRequest.jobData.title);
          setStep(3);
        } else {
          alert('Failed to submit job: ' + (result.error || 'Server error'));
        }

                          const file = e.target.files[0];

                            const compressed = await compressImage(file);
                            setJobInfo({ ...jobInfo, image: compressed });

                <div className="mt-6 flex gap-3">

                </div>

            ) : (
              <form onSubmit={submitAd}>
                <div className="space-y-4 mb-6">
                  <div className="flex gap-4">

                    <label className="flex-1 cursor-pointer"><input type="radio" name="provider" value="airtel" checked={payment.provider === 'airtel'} onChange={e => setPayment({ ...payment, provider: e.target.value })} className="peer sr-only" /><div className="p-4 rounded-lg border-2 text-center peer-checked:border-red-500 peer-checked:bg-red-500/10 transition-all" style={{ borderColor: 'var(--border)' }}><div className="font-bold text-red-500">Airtel Money</div></div></label>
                  </div>
                  <div className="p-4 rounded-lg text-center" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border)' }}>
                    <p className="text-sm mb-1" style={{ color: 'var(--fg-muted)' }}>Agent Name</p><p className="font-bold text-lg" style={{ color: 'var(--fg-primary)' }}>{payment.provider === 'mtn' ? 'John Banda' : 'Mary Phiri'}</p>
                    <p className="text-sm mb-1 mt-2" style={{ color: 'var(--fg-muted)' }}>Agent Number</p><p className="font-mono text-xl font-bold" style={{ color: 'var(--accent)' }}>{payment.provider === 'mtn' ? '0976 123 456' : '0977 987 654'}</p>
                    <p className="text-xs mt-2 text-[#4ade80]">Amount: {formatPrice(100)} (Posting Fee)</p>
                  </div>
                  <div><label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Transaction ID</label><input required name="transactionId" value={payment.transactionId} onChange={e => setPayment({ ...payment, transactionId: e.target.value })} type="text" placeholder="e.g. 1234567890" className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} /></div>
                </div>
                <div className="mt-6 flex gap-3">
                  <button type="button" onClick={() => setStep(1)} className="flex-1 px-4 py-3 rounded-lg font-medium text-sm" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-secondary)' }}>Back</button>
                  <button type="submit" disabled={loading} className="flex-1 px-4 py-3 rounded-lg font-semibold text-sm transition-all hover:scale-105 disabled:opacity-50" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>{loading ? 'Confirming...' : 'Confirm & Post'}</button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    };

    const JobsPage = () => {
      const { jobs } = useApp();
      const [selectedJob, setSelectedJob] = useState(null);
      const [showAdvertiseModal, setShowAdvertiseModal] = useState(false);
      return (
        <div className="min-h-screen pt-24 pb-16" style={{ backgroundColor: 'var(--bg-primary)' }}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-6">
              <div>
                <h1 className="font-display text-3xl sm:text-4xl font-bold mb-2" style={{ color: 'var(--fg-primary)' }}>Find Your Dream Job</h1>
                <p className="text-base" style={{ color: 'var(--fg-secondary)' }}>Apply for the latest openings or advertise a vacancy.</p>
              </div>
              <button onClick={() => setShowAdvertiseModal(true)} className="px-6 py-3 rounded-lg font-medium text-sm transition-all hover:scale-105 focus-ring flex items-center gap-2" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg> Advertise Job</button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">{jobs.map((job, index) => <JobCard key={job._id} job={job} onApply={setSelectedJob} />)}</div>
          </div>
          {selectedJob && <JobApplicationModal job={selectedJob} onClose={() => setSelectedJob(null)} />}
          {showAdvertiseModal && <AdvertiseJobModal onClose={() => setShowAdvertiseModal(false)} />}
        </div>
      );
    };

    const SearchBar = ({ variant = 'hero', onSearch, initialValues = {} }) => {
      const { formatPrice } = useApp();
      const [location, setLocation] = useState(initialValues.location || '');
      const [minPrice, setMinPrice] = useState(initialValues.minPrice || '');
      const [maxPrice, setMaxPrice] = useState(initialValues.maxPrice || '');
      const [bedrooms, setBedrooms] = useState(initialValues.bedrooms || 'any');

      const handleSearch = async (e) => {
        e.preventDefault();
        if (onSearch) onSearch({ location, minPrice, maxPrice, bedrooms });
      };

      const isHero = variant === 'hero';

      return (
        <form onSubmit={handleSearch} className={`w-full ${isHero ? 'max-w-4xl mx-auto' : ''}`}>
          <div className={`rounded-2xl ${isHero ? 'p-6 sm:p-8' : 'p-4 sm:p-5'}`} style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="relative">
                <label className="block text-xs font-medium mb-2" style={{ color: 'var(--fg-muted)' }}>Location</label>
                <div className="relative">
                  <span className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: 'var(--fg-muted)' }}><Icons.Location /></span>
                  <input type="text" placeholder="City, state, or address" value={location} onChange={e => setLocation(e.target.value)} className="w-full pl-11 pr-4 py-3 rounded-lg text-sm focus-ring transition-all" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} />
                </div>
              </div>
              <div>
                <label className="block text-xs font-medium mb-2" style={{ color: 'var(--fg-muted)' }}>Min Price</label>
                <select value={minPrice} onChange={e => setMinPrice(e.target.value)} className="w-full px-4 py-3 rounded-lg text-sm focus-ring transition-all appearance-none cursor-pointer" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }}>
                  <option value="">No min</option>
                  {[1000, 2000, 3000, 5000, 7500, 10000].map(val => (
                    <option key={val} value={val}>{formatPrice(val)}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs font-medium mb-2" style={{ color: 'var(--fg-muted)' }}>Max Price</label>
                <select value={maxPrice} onChange={e => setMaxPrice(e.target.value)} className="w-full px-4 py-3 rounded-lg text-sm focus-ring transition-all appearance-none cursor-pointer" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }}>
                  <option value="">No max</option>
                  {[2000, 3000, 5000, 7500, 10000, 15000].map(val => (
                    <option key={val} value={val}>{formatPrice(val)}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs font-medium mb-2" style={{ color: 'var(--fg-muted)' }}>Bedrooms</label>
                <select value={bedrooms} onChange={e => setBedrooms(e.target.value)} className="w-full px-4 py-3 rounded-lg text-sm focus-ring transition-all appearance-none cursor-pointer" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }}><option value="any">Any</option><option value="0">Studio</option><option value="1">1 Bedroom</option><option value="2">2 Bedrooms</option><option value="3">3 Bedrooms</option><option value="4">4+ Bedrooms</option></select>
              </div>
            </div>
            <div className="mt-5 flex flex-col sm:flex-row gap-3 justify-center">
              <button type="submit" className="flex items-center justify-center gap-2 px-8 py-3.5 rounded-lg font-semibold text-sm transition-all hover:scale-105 focus-ring" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}><Icons.Search /> Search Properties</button>
              {variant === 'results' && <button type="button" onClick={() => { setLocation(''); setMinPrice(''); setMaxPrice(''); setBedrooms('any'); }} className="px-6 py-3.5 rounded-lg font-medium text-sm transition-all hover:opacity-80 focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-secondary)', border: '1px solid var(--border)' }}>Clear Filters</button>}
            </div>
          </div>
        </form>
      );
    };

    const PropertyCard = ({ property, index }) => {
      const { navigateTo, formatPrice } = useApp();
      const [imageLoaded, setImageLoaded] = useState(false);
      // const formatPrice = (price) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'ZMW', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(price);
      const bedroomLabel = property.bedrooms === 0 ? 'Studio' : `${property.bedrooms} Bed`;
      return (
        <article className="group rounded-xl overflow-hidden transition-all duration-300 hover:translate-y-[-4px] animate-fade-in-up cursor-pointer" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)', animationDelay: `${index * 0.1}s`, opacity: 0 }} onClick={() => navigateTo('property', property)} tabIndex={0} role="button" aria-label={`View ${property.title}`} onKeyPress={e => e.key === 'Enter' && navigateTo('property', property)}>
          <div className="relative h-56 overflow-hidden">
            {!imageLoaded && <div className="absolute inset-0 card-shimmer"></div>}
            <img src={property.images[0]} alt={property.title} className={`w-full h-full object-cover transition-all duration-500 group-hover:scale-110 ${imageLoaded ? 'opacity-100' : 'opacity-0'}`} onLoad={() => setImageLoaded(true)} />
            {property.featured && <div className="absolute top-3 left-3 px-3 py-1.5 rounded-full text-xs font-semibold" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>Featured</div>}
            <div className="absolute inset-0 transition-opacity flex items-end p-4 opacity-100 sm:opacity-0 sm:group-hover:opacity-100" style={{ background: 'linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 60%)' }}>
              <button
                onClick={(e) => { e.stopPropagation(); navigateTo('property', property, true); }}
                className="px-4 py-1.5 rounded-lg font-bold text-xs bg-[var(--accent)] text-[var(--bg-primary)] shadow-xl transform active:scale-95 transition-transform"
              >
                Booking
              </button>
            </div>
          </div>
          <div className="p-5">
            <div className="flex items-start justify-between mb-2">
              <h3 className="font-display text-lg font-semibold line-clamp-1 group-hover:text-[#c9a55c] transition-colors" style={{ color: 'var(--fg-primary)' }}>{property.title}</h3>
            </div>
            <div className="flex items-center gap-1.5 mb-3" style={{ color: 'var(--fg-muted)' }}><Icons.Location /><span className="text-sm">{property.location.city}, {property.location.state}</span></div>
            <div className="flex items-center gap-4 mb-4 text-sm" style={{ color: 'var(--fg-secondary)' }}>
              <div className="flex items-center gap-1.5"><Icons.Bed /><span>{bedroomLabel}</span></div>
              <div className="flex items-center gap-1.5"><Icons.Bath /><span>{property.bathrooms} Bath</span></div>
              <div className="flex items-center gap-1.5"><Icons.Area /><span>{property.area.toLocaleString()} sqft</span></div>
            </div>
            <div className="flex items-center justify-between pt-4" style={{ borderTop: '1px solid var(--border)' }}>
              <div><span className="font-display text-2xl font-bold" style={{ color: 'var(--accent)' }}>{formatPrice(property.price)}</span><span className="text-sm ml-1" style={{ color: 'var(--fg-muted)' }}>/mo</span></div>
              <span className="text-sm font-medium group-hover:underline transition-all" style={{ color: 'var(--accent)' }}>View Details</span>
            </div>
          </div>
        </article>
      );
    };

    const Hero = () => {
      const { navigateTo, setSearchResults, setIsLoading, setLastSearch, properties } = useApp();
      const [isVisible, setIsVisible] = useState(false);
      useEffect(() => setIsVisible(true), []);

      const handleSearch = async (filters) => {
        setIsLoading(true);
        const results = await api.searchProperties(filters, properties);
        setSearchResults(results.data);
        setLastSearch(filters);
        setIsLoading(false);
        navigateTo('search');
      };

      return (
        <section className="relative min-h-screen flex items-center justify-center hero-gradient pt-20">
          <div className="absolute inset-0 overflow-hidden">
            <div className="absolute top-1/4 left-1/4 w-96 h-96 rounded-full opacity-20 blur-3xl" style={{ backgroundColor: 'var(--accent)' }}></div>
            <div className="absolute bottom-1/4 right-1/4 w-64 h-64 rounded-full opacity-10 blur-3xl" style={{ backgroundColor: 'var(--accent)' }}></div>
          </div>
          <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
            <div className="text-center mb-8 sm:mb-12">
              <h1 className={`font-display text-3xl sm:text-5xl lg:text-6xl font-bold mb-4 sm:mb-6 transition-all duration-700 hero-title ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`} style={{ color: 'var(--fg-primary)' }}>Find Your Perfect Job<br /><span style={{ color: 'var(--accent)' }}>& Rental Home</span></h1>
              <p className={`text-sm sm:text-lg lg:text-xl max-w-2xl mx-auto transition-all duration-700 delay-200 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`} style={{ color: 'var(--fg-secondary)' }}>Discover thousands of rental properties across the country. From cozy studios to luxury estates, your next home & dream job is waiting.</p>
            </div>
            <div className={`transition-all duration-700 delay-400 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}><SearchBar variant="hero" onSearch={handleSearch} /></div>
            <div className={`grid grid-cols-2 sm:grid-cols-4 gap-6 mt-16 transition-all duration-700 delay-600 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}>
              {[{ value: '12K+', label: 'Properties' }, { value: '8K+', label: 'Happy Renters' }, { value: '50+', label: 'Cities' }, { value: '4.9', label: 'Avg Rating' }].map((stat, i) => (
                <div key={i} className="text-center"><div className="font-display text-3xl sm:text-4xl font-bold mb-1" style={{ color: 'var(--accent)' }}>{stat.value}</div><div className="text-sm" style={{ color: 'var(--fg-muted)' }}>{stat.label}</div></div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const FeaturedProperties = () => {
      const [properties, setProperties] = useState([]);
      const [loading, setLoading] = useState(true);
      const { navigateTo } = useApp();

      const { properties: allProperties } = useApp();

      useEffect(() => {
        const featured = allProperties.filter(p => p.featured && p.available);
        setProperties(featured);
        setLoading(false);
      }, [allProperties]);

      return (
        <section className="py-24" style={{ backgroundColor: 'var(--bg-secondary)' }}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-12">
              <div>
                <h2 className="font-display text-3xl sm:text-4xl font-bold mb-3" style={{ color: 'var(--fg-primary)' }}>Featured Properties</h2>
                <p className="text-base" style={{ color: 'var(--fg-secondary)' }}>Hand-picked listings selected for quality and value</p>
              </div>
              <button onClick={() => navigateTo('search')} className="mt-4 sm:mt-0 text-sm font-medium flex items-center gap-2 hover:gap-3 transition-all focus-ring rounded px-2 py-1" style={{ color: 'var(--accent)' }}>View All Properties<span className="transform transition-transform">→</span></button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">{loading ? Array(4).fill(0).map((_, i) => <PropertySkeleton key={i} />) : properties.slice(0, 4).map((property, i) => <PropertyCard key={property._id} property={property} index={i} />)}</div>
          </div>
        </section>
      );
    };

    const PropertyDetail = () => {
      const { selectedProperty, navigateTo, properties, formatPrice, trackSubmission, autoContact, setAutoContact } = useApp();
      const [currentImage, setCurrentImage] = useState(0);
      const [showContact, setShowContact] = useState(false);
      const [contactStep, setContactStep] = useState('form'); // 'form', 'payment', 'pending', 'paid'
      const [contactForm, setContactForm] = useState({ name: '', email: '', phone: '', message: '' });
      const [submitStatus, setSubmitStatus] = useState(null);
      const [payment, setPayment] = useState({ provider: 'mtn', transactionId: '' });
      const [isVerifying, setIsVerifying] = useState(false);
      const [currentInquiryId, setCurrentInquiryId] = useState(null);
      const [paymentFlow, setPaymentFlow] = useState('direct'); // 'direct' or 'renting'

      useEffect(() => {
        if (autoContact) {
          setShowContact(true);
          setContactStep('form');
          setTimeout(() => {
            document.getElementById('contact-section')?.scrollIntoView({ behavior: 'smooth' });
          }, 100);
          setAutoContact(false);
        }
      }, [autoContact, setAutoContact]);

      const property = selectedProperty || properties.find(p => p._id === selectedProperty?._id) || properties[0];

      const handleContactSubmit = async (e) => {
        e.preventDefault();
        setPaymentFlow('renting');
        setContactStep('payment');
      };

      const handlePaymentSubmit = async (e) => {
        e.preventDefault();
        setIsVerifying(true);

        const payload = {
          name: contactForm.name || 'Interested User',
          email: contactForm.email || 'no-email@provided.com',
          phone: contactForm.phone || '0000000000',
          message: contactForm.message || (paymentFlow === 'renting' ? 'Renting Request' : 'Direct Contact Request'),
          propertyId: property._id,
          propertyTitle: property.title,
          transactionId: payment.transactionId,
          provider: payment.provider,
          amount: paymentFlow === 'renting' ? property.price : 10
        };

        const res = await api.submitDirectInquiry(payload);
        if (res.success) {
          setCurrentInquiryId(res.inquiry._id);
          trackSubmission(res.inquiry._id, 'inquiry', property.title);
          setContactStep('pending');
        } else {
          alert('Failed to submit: ' + (res.error || 'Server error'));
        }
        setIsVerifying(false);
      };

      // Status Polling Effect
      useEffect(() => {
        let interval;
        if (contactStep === 'pending' && currentInquiryId) {
          interval = setInterval(async () => {
            const res = await api.getDirectInquiry(currentInquiryId);
            if (res.success && res.status === 'confirmed') {
              setContactStep('paid');
              clearInterval(interval);
            }
          }, 4000); // Check every 4 seconds
        }
        return () => clearInterval(interval);
      }, [contactStep, currentInquiryId]);

      const bedroomLabel = property.bedrooms === 0 ? 'Studio' : `${property.bedrooms} Bedrooms`;

      if (!property) return <div className="min-h-screen flex items-center justify-center"><p style={{ color: 'var(--fg-muted)' }}>Property not found</p></div>;

      return (
        <div className="min-h-screen pt-24 pb-16" style={{ backgroundColor: 'var(--bg-primary)' }}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <button onClick={() => navigateTo('search')} className="flex items-center gap-2 mb-6 text-sm font-medium transition-all hover:gap-3 focus-ring rounded px-2 py-1" style={{ color: 'var(--fg-secondary)' }}><Icons.Arrow /> Back to Results</button>
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              <div className="lg:col-span-2">
                <div className="relative rounded-xl overflow-hidden mb-8 animate-fade-in shadow-xl">
                  <div className="relative h-[250px] sm:h-[450px]"><img src={property.images[currentImage]} alt={property.title} className="w-full h-full object-cover" /></div>
                  <button
                    onClick={() => { setShowContact(true); document.getElementById('contact-section')?.scrollIntoView({ behavior: 'smooth' }); }}
                    className="absolute bottom-10 left-4 px-6 py-2 rounded-lg font-bold text-sm shadow-2xl transition-all hover:scale-110 active:scale-95 z-10 sm:bottom-12"
                    style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}
                  >
                    Booking
                  </button>
                  {property.images.length > 1 && <div className="absolute bottom-4 left-4 right-4 flex gap-2">{property.images.map((_, i) => <button key={i} onClick={() => setCurrentImage(i)} className={`flex-1 h-1.5 rounded-full transition-all focus-ring ${i === currentImage ? 'opacity-100' : 'opacity-40 hover:opacity-60'}`} style={{ backgroundColor: 'var(--fg-primary)' }} aria-label={`View image ${i + 1}`} />)}</div>}
                  {property.featured && <div className="absolute top-4 left-4 px-4 py-2 rounded-full text-sm font-semibold" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>Featured Listing</div>}
                </div>
                <div className="animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                  <h1 className="font-display text-3xl sm:text-4xl font-bold mb-4" style={{ color: 'var(--fg-primary)' }}>{property.title}</h1>
                  <div className="flex items-center gap-2 mb-6" style={{ color: 'var(--fg-muted)' }}><Icons.Location /><span>{property.location.address}</span><span>•</span><span>{property.location.city}, {property.location.state} {property.location.zipCode}</span></div>
                  <div className="grid grid-cols-4 gap-4 p-5 rounded-xl mb-8" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>
                    {[{ icon: <Icons.Bed />, label: bedroomLabel }, { icon: <Icons.Bath />, label: `${property.bathrooms} Bathrooms` }, { icon: <Icons.Area />, label: `${property.area.toLocaleString()} sqft` }, { icon: null, label: (property.propertyType || 'Property').charAt(0).toUpperCase() + (property.propertyType || '').slice(1) }].map((item, i) => <div key={i} className="text-center">{item.icon && <div className="flex justify-center mb-2" style={{ color: 'var(--accent)' }}>{item.icon}</div>}<span className="text-sm" style={{ color: 'var(--fg-secondary)' }}>{item.label}</span></div>)}
                  </div>
                  <div className="mb-8"><h2 className="font-display text-xl font-semibold mb-4" style={{ color: 'var(--fg-primary)' }}>About This Property</h2><p className="leading-relaxed" style={{ color: 'var(--fg-secondary)' }}>{property.description}</p></div>
                  <div><h2 className="font-display text-xl font-semibold mb-4" style={{ color: 'var(--fg-primary)' }}>Amenities</h2><div className="grid grid-cols-2 sm:grid-cols-3 gap-3">{property.amenities.map((amenity, i) => <div key={i} className="flex items-center gap-2 p-3 rounded-lg" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}><span style={{ color: 'var(--accent)' }}><Icons.Check /></span><span className="text-sm" style={{ color: 'var(--fg-secondary)' }}>{amenity}</span></div>)}</div></div>
                </div>
              </div>
              <div className="lg:col-span-1" id="contact-section">
                <div className="sticky top-28 rounded-xl p-6 animate-slide-in-right" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>
                  <div className="mb-6"><span className="font-display text-3xl font-bold" style={{ color: 'var(--accent)' }}>{formatPrice(property.price)}</span><span className="text-base ml-1" style={{ color: 'var(--fg-muted)' }}>/month</span></div>

                  {!showContact ? (
                    <button onClick={() => setShowContact(true)} className="w-full py-4 rounded-lg font-semibold text-sm transition-all hover:scale-105 focus-ring mb-4" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>Contact Property</button>
                  ) : (
                    <div className="animate-fade-in">
                      {contactStep === 'form' && (
                        <form onSubmit={handleContactSubmit} className="space-y-4 mb-4">
                          <input type="text" placeholder="Your Name" required value={contactForm.name} onChange={e => setContactForm({ ...contactForm, name: e.target.value })} className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} />
                          <input type="email" placeholder="Email Address" required value={contactForm.email} onChange={e => setContactForm({ ...contactForm, email: e.target.value })} className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} />
                          <input type="tel" placeholder="Phone Number" value={contactForm.phone} onChange={e => setContactForm({ ...contactForm, phone: e.target.value })} className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} />
                          <textarea placeholder="Your Message" rows={3} value={contactForm.message} onChange={e => setContactForm({ ...contactForm, message: e.target.value })} className="w-full px-4 py-3 rounded-lg text-sm focus-ring resize-none" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }}></textarea>
                          {submitStatus && <div className="p-3 rounded-lg text-sm" style={{ backgroundColor: submitStatus.success ? 'rgba(74, 222, 128, 0.1)' : 'rgba(248, 113, 113, 0.1)', color: submitStatus.success ? 'var(--success)' : 'var(--error)' }}>{submitStatus.message || submitStatus.error}</div>}
                          <button type="submit" className="w-full py-4 rounded-lg font-semibold text-sm transition-all hover:scale-105 focus-ring" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>Send Inquiry</button>

                          <div className="relative py-4 flex items-center">
                            <div className="flex-grow border-t border-[var(--border)]"></div>
                            <span className="flex-shrink mx-4 text-xs font-bold uppercase" style={{ color: 'var(--fg-muted)' }}>OR</span>
                            <div className="flex-grow border-t border-[var(--border)]"></div>
                          </div>

                          <button
                            type="button"
                            onClick={() => { setPaymentFlow('direct'); setContactStep('payment'); }}
                            className="w-full py-4 rounded-lg font-semibold text-sm transition-all hover:scale-105 focus-ring border-2 border-[var(--accent)]"
                            style={{ color: 'var(--accent)' }}
                          >
                            Talk to us directly
                          </button>
                        </form>
                      )}

                      {contactStep === 'payment' && (
                        <form onSubmit={handlePaymentSubmit} className="space-y-4 mb-4">
                          <div className="p-4 rounded-lg text-center mb-4" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border)' }}>
                            <p className="text-sm font-medium mb-3" style={{ color: 'var(--fg-primary)' }}>{paymentFlow === 'renting' ? 'Pay Rent to Confirm Booking' : 'Pay refundable fee to talk directly'}</p>
                            <div className="flex gap-2 mb-4">
                              <label className="flex-1 cursor-pointer"><input type="radio" value="mtn" checked={payment.provider === 'mtn'} onChange={e => setPayment({ ...payment, provider: e.target.value })} className="peer sr-only" /><div className="p-2 rounded-lg border-2 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/10 text-xs font-bold transition-all" style={{ borderColor: 'var(--border)' }}>MTN</div></label>
                              <label className="flex-1 cursor-pointer"><input type="radio" value="airtel" checked={payment.provider === 'airtel'} onChange={e => setPayment({ ...payment, provider: e.target.value })} className="peer sr-only" /><div className="p-2 rounded-lg border-2 peer-checked:border-red-500 peer-checked:bg-red-500/10 text-xs font-bold transition-all" style={{ borderColor: 'var(--border)' }}>Airtel</div></label>
                            </div>
                            <p className="text-xs mb-1" style={{ color: 'var(--fg-muted)' }}>Send <span className="font-bold text-[var(--accent)]">{formatPrice(paymentFlow === 'renting' ? property.price : 10)}</span> to:</p>
                            <p className="font-mono text-lg font-bold" style={{ color: 'var(--fg-primary)' }}>{payment.provider === 'mtn' ? '0976 123 456' : '0977 987 654'}</p>
                          </div>
                          <input
                            required
                            placeholder="Transaction ID"
                            value={payment.transactionId}
                            onChange={e => setPayment({ ...payment, transactionId: e.target.value })}
                            className="w-full px-4 py-3 rounded-lg text-sm focus-ring"
                            style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }}
                          />
                          <button
                            type="submit"
                            disabled={isVerifying}
                            className="w-full py-4 rounded-lg font-semibold text-sm transition-all hover:scale-105 focus-ring disabled:opacity-50"
                            style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}
                          >
                            {isVerifying ? 'Verifying...' : (paymentFlow === 'renting' ? 'Request to Rent' : 'Pay & View Number')}
                          </button>
                          <button type="button" onClick={() => setContactStep('form')} className="w-full text-xs font-medium" style={{ color: 'var(--fg-muted)' }}>Back to Inquiry Form</button>
                        </form>
                      )}
                      {contactStep === 'pending' && (
                        <div className="animate-fade-in text-center p-6" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border)', borderRadius: '12px' }}>
                          <div className="flex justify-center mb-4">
                            <div className="w-10 h-10 border-4 border-[var(--accent)] border-t-transparent rounded-full animate-spin"></div>
                          </div>
                          <h3 className="font-bold mb-2">Verifying Payment</h3>
                          <p className="text-sm mb-4" style={{ color: 'var(--fg-secondary)' }}>Please wait while the admin confirms your transaction ({payment.transactionId}).</p>
                          <p className="text-xs italic" style={{ color: 'var(--fg-muted)' }}>This page will update automatically once confirmed.</p>
                          <button onClick={() => setContactStep('payment')} className="mt-6 text-sm underline" style={{ color: 'var(--accent)' }}>Edit Transaction ID</button>
                        </div>
                      )}

                      {contactStep === 'paid' && (
                        <div className="animate-fade-in text-center p-4">
                          <div className="w-12 h-12 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
                            <Icons.Check />
                          </div>
                          <h3 className="font-bold mb-2">Payment Verified!</h3>
                          <p className="text-sm mb-6" style={{ color: 'var(--fg-secondary)' }}>
                            {paymentFlow === 'renting'
                              ? 'Your renting request has been confirmed by the system and sent to the landlord.'
                              : 'You can now talk to us directly or send your inquiry form.'}
                          </p>

                          <div className="space-y-3">
                            {paymentFlow === 'renting' ? (
                              <div className="p-4 rounded-lg bg-green-500/10 text-green-400 text-sm font-medium border border-green-500/20">
                                Booking Confirmed! We will contact you shortly.
                              </div>
                            ) : (
                              <>
                                <a href="tel:0976123456" className="w-full py-3 rounded-lg font-bold text-sm bg-[var(--accent)] text-[var(--bg-primary)] flex items-center justify-center gap-2">
                                  <Icons.Phone /> Call Specialist
                                </a>
                                <button onClick={() => setContactStep('form')} className="w-full py-3 rounded-lg font-bold text-sm border-2 border-[var(--border)] text-[var(--fg-primary)]">
                                  Send Inquiry Form
                                </button>
                              </>
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {contactStep !== 'paid' && (
                    <div className="flex items-center justify-center gap-6 pt-4 mt-2" style={{ borderTop: '1px solid var(--border)' }}>
                      <div className="flex items-center gap-2 opacity-30 select-none" title="Pay fee to unlock" style={{ color: 'var(--fg-muted)' }}><Icons.Phone /><span className="text-sm">Locked</span></div>
                      <div className="flex items-center gap-2" style={{ color: 'var(--fg-muted)' }}><Icons.Mail /><span className="text-sm">hjnest@gmail.com</span></div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const SearchResults = () => {
      const { searchResults, setSearchResults, isLoading, setIsLoading, lastSearch, setLastSearch, navigateTo, properties } = useApp();
      const [hasSearched, setHasSearched] = useState(false);
      const [showAdvertiseModal, setShowAdvertiseModal] = useState(false);

      const handleSearch = async (filters) => {
        setIsLoading(true); setHasSearched(true);
        const results = await api.searchProperties(filters, properties);
        setSearchResults(results.data); setLastSearch(filters);
        setIsLoading(false);
      };

      return (
        <div className="min-h-screen pt-24 pb-16" style={{ backgroundColor: 'var(--bg-primary)' }}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-6">
              <div>
                <h1 className="font-display text-3xl sm:text-4xl font-bold mb-2" style={{ color: 'var(--fg-primary)' }}>Find Your Rental</h1>
                <p className="text-base" style={{ color: 'var(--fg-secondary)' }}>Browse properties or list your own house for rent.</p>
              </div>
              <button onClick={() => setShowAdvertiseModal(true)} className="px-6 py-3 rounded-lg font-medium text-sm transition-all hover:scale-105 focus-ring flex items-center gap-2" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg> Add Post</button>
            </div>

            <div className="mb-10"><SearchBar variant="results" onSearch={handleSearch} initialValues={lastSearch || {}} /></div>

            {isLoading ? <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">{Array(6).fill(0).map((_, i) => <PropertySkeleton key={i} />)}</div> : searchResults.length > 0 ? <><p className="mb-6 text-sm" style={{ color: 'var(--fg-muted)' }}>{searchResults.length} {searchResults.length === 1 ? 'property' : 'properties'} found</p><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">{searchResults.map((property, i) => <PropertyCard key={property._id} property={property} index={i} />)}</div></> : hasSearched ? <div className="text-center py-20"><div className="text-6xl mb-4">🏠</div><h3 className="font-display text-xl font-semibold mb-2" style={{ color: 'var(--fg-primary)' }}>No Properties Found</h3><p className="mb-6" style={{ color: 'var(--fg-muted)' }}>Try adjusting your search filters to see more results</p><button onClick={() => handleSearch({ location: '', minPrice: '', maxPrice: '', bedrooms: 'any' })} className="px-6 py-3 rounded-lg font-medium text-sm transition-all hover:scale-105 focus-ring" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>View All Properties</button></div> : <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">{properties.filter(p => p.available).map((property, i) => <PropertyCard key={property._id} property={property} index={i} />)}</div>}
          </div>
          {showAdvertiseModal && <AdvertisePropertyModal onClose={() => setShowAdvertiseModal(false)} />}
        </div>
      );
    };

    const AboutPage = () => (
      <div className="min-h-screen pt-24 pb-16" style={{ backgroundColor: 'var(--bg-primary)' }}>
        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
          <h1 className="font-display text-4xl sm:text-5xl font-bold mb-8 animate-fade-in-up" style={{ color: 'var(--fg-primary)' }}>About HomeNest</h1>
          <div className="prose prose-lg">
            <p className="text-lg mb-6 animate-fade-in-up stagger-1" style={{ color: 'var(--fg-secondary)' }}>HomeNest is your trusted partner in finding the perfect rental property. We connect renters with verified properties across the nation, making the search for your next home simple and stress-free.</p>
            <div className="p-8 rounded-xl my-10 animate-fade-in-up stagger-2" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>
              <h2 className="font-display text-2xl font-semibold mb-6" style={{ color: 'var(--fg-primary)' }}>Our Mission</h2>
              <p style={{ color: 'var(--fg-secondary)' }}>We believe everyone deserves a place they can call home. Our mission is to transform the rental experience by providing a transparent, efficient, and user-friendly platform that empowers renters to make informed decisions.</p>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 my-10">
              {[{ number: '12K+', label: 'Active Listings' }, { number: '50+', label: 'Cities Covered' }, { number: '8K+', label: 'Happy Renters' }].map((stat, i) => <div key={i} className="text-center p-6 rounded-xl animate-fade-in-up" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)', animationDelay: `${0.3 + i * 0.1}s` }}><div className="font-display text-3xl font-bold mb-2" style={{ color: 'var(--accent)' }}>{stat.number}</div><div className="text-sm" style={{ color: 'var(--fg-muted)' }}>{stat.label}</div></div>)}
            </div>
          </div>
        </div>
      </div>
    );

    const BlogPage = () => {
      const blogPosts = [
        { id: 1, title: "Modern Living: Why More People are Choosing Apartments", category: "Real Estate", date: "Feb 15, 2024", image: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=800", excerpt: "Explore the growing trend of modern apartment living and how it fits the fast-paced lifestyle of today's urbanites." },
        { id: 2, title: "Job Hunting in 2024: Top Skills You Need to Succeed", category: "Career", date: "Feb 10, 2024", image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800", excerpt: "The job market is changing rapidly. We break down the most in-demand skills for the upcoming year." },
        { id: 3, title: "Decorating Your Rental: Personalizing Without the Permanent Changes", category: "Interior Design", date: "Feb 05, 2024", image: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=800", excerpt: "Make your rental feel like home with these reversible decor ideas that won't jeopardize your security deposit." }
      ];

      const testimonials = [
        { name: "Sarah Johnson", role: "Tenant", quote: "HomeNest helped me find my dream apartment in record time. The verification process gave me so much peace of mind.", image: "https://i.pravatar.cc/150?u=sarah" },
        { name: "David Mutale", role: "Job Seeker", quote: "The job board is incredibly easy to use. I applied for a role on Monday and had an interview by Friday!", image: "https://i.pravatar.cc/150?u=david" }
      ];

      const team = [
        { name: "Theophile Mugisha", role: "Founder & Lead Developer", image: "https://i.pravatar.cc/150?u=theo" },
        { name: "Grace Phiri", role: "Operations Manager", image: "https://i.pravatar.cc/150?u=grace" }
      ];

      return (
        <div className="min-h-screen pt-24 pb-16" style={{ backgroundColor: 'var(--bg-primary)' }}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center mb-16 animate-fade-in-up">
              <h1 className="font-display text-4xl sm:text-5xl lg:text-6xl font-bold mb-6" style={{ color: 'var(--fg-primary)' }}>Insights & Stories</h1>
              <p className="text-sm sm:text-lg max-w-2xl mx-auto" style={{ color: 'var(--fg-secondary)' }}>Your go-to source for real estate advice, career tips, and the latest news from around the nation.</p>
            </div>

            {/* Blog Posts Grid */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-24">
              {blogPosts.map((post, i) => (
                <article key={post.id} className="group rounded-2xl overflow-hidden animate-fade-in-up transition-all hover:translate-y-[-4px]" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)', animationDelay: `${i * 0.1}s` }}>
                  <div className="relative h-56 overflow-hidden">
                    <img src={post.image} alt={post.title} className="w-full h-full object-cover transition-all duration-500 group-hover:scale-110" />
                    <div className="absolute top-4 left-4 px-3 py-1 rounded-full text-xs font-bold" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>{post.category}</div>
                  </div>
                  <div className="p-6">
                    <div className="text-xs mb-3" style={{ color: 'var(--fg-muted)' }}>{post.date}</div>
                    <h2 className="font-display text-xl font-bold mb-3 group-hover:text-[#c9a55c] transition-colors" style={{ color: 'var(--fg-primary)' }}>{post.title}</h2>
                    <p className="text-sm mb-6 line-clamp-3" style={{ color: 'var(--fg-secondary)' }}>{post.excerpt}</p>
                    <button className="flex items-center gap-2 text-sm font-bold" style={{ color: 'var(--accent)' }}>Read More <Icons.Arrow /></button>
                  </div>
                </article>
              ))}
            </div>

            {/* Testimonials Section */}
            <div className="mb-24 py-16 px-8 rounded-3xl text-center relative overflow-hidden animate-fade-in-up" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border)' }}>
              <div className="absolute top-10 left-10"><Icons.Quote /></div>
              <h2 className="font-display text-3xl font-bold mb-4" style={{ color: 'var(--fg-primary)' }}>What Our Community Says</h2>
              <p className="text-sm mb-12" style={{ color: 'var(--fg-secondary)' }}>Trusted by thousands of seekers and leasers across the country.</p>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                {testimonials.map((test, i) => (
                  <div key={i} className="p-8 rounded-2xl text-left transition-all" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>
                    <p className="italic mb-6" style={{ color: 'var(--fg-secondary)' }}>"{test.quote}"</p>
                    <div className="flex items-center gap-4">
                      <img src={test.image} className="w-12 h-12 rounded-full border-2 border-[var(--accent)]" alt={test.name} />
                      <div>
                        <div className="font-bold text-sm" style={{ color: 'var(--fg-primary)' }}>{test.name}</div>
                        <div className="text-xs" style={{ color: 'var(--fg-muted)' }}>{test.role}</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Team Members Section */}
            <div className="text-center animate-fade-in-up">
              <h2 className="font-display text-3xl font-bold mb-4" style={{ color: 'var(--fg-primary)' }}>Meet Our Current Team</h2>
              <p className="text-sm mb-12" style={{ color: 'var(--fg-secondary)' }}>The passionate individuals building the future of property rentals.</p>
              <div className="flex flex-wrap justify-center gap-12">
                {team.map((member, i) => (
                  <div key={i} className="group">
                    <div className="relative mb-4">
                      <div className="absolute inset-0 rounded-full scale-110 opacity-0 group-hover:opacity-20 transition-all duration-300" style={{ backgroundColor: 'var(--accent)' }}></div>
                      <img src={member.image} className="w-32 h-32 rounded-full border-4 border-[var(--border)] group-hover:border-[var(--accent)] transition-all duration-300" alt={member.name} />
                    </div>
                    <div className="font-bold text-lg" style={{ color: 'var(--fg-primary)' }}>{member.name}</div>
                    <div className="text-xs font-medium" style={{ color: 'var(--accent)' }}>{member.role}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const NotificationsPage = () => {
      const { userSubmissions, clearNotified } = useApp();
      return (
        <div className="min-h-screen pt-24 pb-16" style={{ backgroundColor: 'var(--bg-primary)' }}>
          <div className="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 className="font-display text-3xl font-bold mb-8" style={{ color: 'var(--fg-primary)' }}>My Activity & Alerts</h1>
            <div className="space-y-4">
              {userSubmissions.length === 0 ? (
                <div className="text-center py-20" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: '16px' }}>
                  <div className="text-6xl mb-4">🔔</div>
                  <p style={{ color: 'var(--fg-muted)' }}>No submissions or alerts found.</p>
                </div>
              ) : (
                userSubmissions.map((sub, idx) => (
                  <div
                    key={sub.id || idx}
                    className={`p-5 rounded-xl transition-all border ${sub.status === 'confirmed' && !sub.notified ? 'ring-2 ring-[var(--accent)]' : ''}`}
                    style={{ backgroundColor: 'var(--bg-card)', borderColor: 'var(--border)' }}
                    onClick={() => { if (sub.status === 'confirmed') clearNotified(sub.id); }}
                  >
                    <div className="flex justify-between items-start mb-2">
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider flex items-center gap-1" style={{ backgroundColor: sub.status === 'confirmed' ? 'var(--success)' : 'var(--warning)', color: '#000' }}>
                        {sub.status === 'confirmed' ? <Icons.Check /> : '●'} {sub.status}
                      </span>
                      <span className="text-xs" style={{ color: 'var(--fg-muted)' }}>{sub.createdAt ? new Date(sub.createdAt).toLocaleDateString() : ''}</span>
                    </div>
                    <h3 className="font-bold text-lg mb-1" style={{ color: 'var(--fg-primary)' }}>{sub.title}</h3>
                    <p className="text-sm" style={{ color: 'var(--fg-secondary)' }}>
                      {sub.status === 'confirmed'
                        ? (sub.type === 'inquiry'
                          ? (<span>Your inquiry is confirmed! Call us at <strong style={{ color: 'var(--accent)' }}>0976 123 456</strong> or return to the property page to view details.</span>)
                          : `Your ${sub.type} submission has been approved and is now live on the platform!`)
                        : `Your ${sub.type} submission is currently being reviewed by our team.`}
                    </p>
                    {sub.status === 'confirmed' && !sub.notified && (
                      <div className="mt-4 flex justify-end">
                        <button className="text-xs font-bold px-3 py-1 rounded bg-[var(--accent)] text-[var(--bg-primary)]">New Update</button>
                      </div>
                    )}
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    const Footer = () => (
      <footer className="py-16 pb-24 sm:pb-16" style={{ backgroundColor: 'var(--bg-secondary)', borderTop: '1px solid var(--border)' }}>
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10">
            <div>
              <div className="flex items-center gap-2 mb-4"><div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{ backgroundColor: 'var(--accent)' }}><span className="font-display text-xl font-bold" style={{ color: 'var(--bg-primary)' }}>H</span></div><span className="font-display text-xl font-semibold" style={{ color: 'var(--fg-primary)' }}>HomeNest</span></div>
              <p className="text-sm" style={{ color: 'var(--fg-muted)' }}>Your trusted partner in finding the perfect rental property.</p>
            </div>
            {[
              { title: 'Quick Links', links: ['Search', 'Featured', 'About', 'Jobs'] },
              { title: 'Property Types', links: ['Apartments', 'Houses', 'Condos', 'Townhouses'] },
              { title: 'Support', links: ['FAQ', 'Privacy Policy', 'Terms of Service', 'Sitemap'] }
            ].map((col, i) => (
              <div key={i}>
                <h4 className="font-semibold mb-4" style={{ color: 'var(--fg-primary)' }}>{col.title}</h4>
                <ul className="space-y-2">{col.links.map((link, j) => <li key={j}><a href="#" className="text-sm transition-colors hover:underline focus-ring rounded px-1" style={{ color: 'var(--fg-muted)' }}>{link}</a></li>)}</ul>
              </div>
            ))}
          </div>
          <div className="mt-12 pt-8 text-center text-sm" style={{ borderTop: '1px solid var(--border)', color: 'var(--fg-muted)' }}>© {new Date().getFullYear()} HomeNest. All rights reserved   POWEREDBY: Mtcode.</div>
        </div>
      </footer>
    );

    const MobileNavBar = () => {
      const { currentPage, navigateTo, userSubmissions } = useApp();
      const activeColor = 'var(--accent)';
      const inactiveColor = 'var(--fg-muted)';
      const unnotifiedCount = userSubmissions.filter(s => s.status === 'confirmed' && !s.notified).length;

      return (
        <nav className="fixed bottom-0 left-0 right-0 z-50 sm:hidden border-t flex justify-around items-center pt-2 pb-5 sm:pb-2" style={{ backgroundColor: 'var(--bg-card)', borderColor: 'var(--border)' }}>
          {[
            { id: 'home', icon: <Icons.Home />, label: 'Home' },
            { id: 'search', icon: <Icons.Search />, label: 'Browse' },
            { id: 'jobs', icon: <Icons.Briefcase />, label: 'Jobs' },
            {
              id: 'notifications', icon: (
                <div className="relative">
                  <Icons.Bell />
                  {unnotifiedCount > 0 && (
                    <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center border border-[var(--bg-card)]">
                      {unnotifiedCount}
                    </span>
                  )}
                </div>
              ), label: 'Alerts'
            },
          ].map(item => (
            <button key={item.id} onClick={() => navigateTo(item.id)} className="flex flex-col items-center gap-1 w-16 focus-ring rounded" aria-label={item.label}>
              <div style={{ color: currentPage === item.id ? activeColor : inactiveColor }}>{item.icon}</div>
              <span className="text-[10px] font-medium" style={{ color: currentPage === item.id ? activeColor : inactiveColor }}>{item.label}</span>
            </button>
          ))}
        </nav>
      );
    };

    const App = () => {
      const { currentPage } = useApp();
      return (
        <div className="min-h-screen flex flex-col">
          <Header />
          <main className="flex-1">
            {currentPage === 'home' && (<><Hero /><FeaturedProperties /></>)}
            {currentPage === 'search' && <SearchResults />}
            {currentPage === 'property' && <PropertyDetail />}
            {currentPage === 'about' && <AboutPage />}
            {currentPage === 'jobs' && <JobsPage />}
            {currentPage === 'blog' && <BlogPage />}
            {currentPage === 'notifications' && <NotificationsPage />}
            {currentPage === 'login' && <AdminLogin />}
            {currentPage === 'admin-dashboard' && <AdminDashboard />}
          </main>
          <Footer />
          <MobileNavBar />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppProvider><App /></AppProvider>);
  </script>
