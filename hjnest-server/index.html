<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H&JNest - Find Your Perfect Rental & Job</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-card: #242424;
      --fg-primary: #f5f5f5;
      --fg-secondary: #a0a0a0;
      --fg-muted: #6b6b6b;
      --accent: #c9a55c;
      --accent-hover: #dbb86e;
      --border: #333333;
      --error: #f87171;
      --warning: #fbbf24;
      --success: #4ade80;
    }

    /* Smallest Screen Adjustments */
    @media (max-width: 480px) {
      :root {
        --max-width: 100%;
      }

      h1 {
        font-size: 1.875rem !important;
      }

      h2 {
        font-size: 1.5rem !important;
      }

      .hero-title {
        font-size: 2.25rem !important;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--fg-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .font-display {
      font-family: 'Playfair Display', serif;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--fg-muted);
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    .animate-slide-in-right {
      animation: slideInRight 0.5s ease-out forwards;
    }

    .stagger-1 {
      animation-delay: 0.1s;
    }

    .stagger-2 {
      animation-delay: 0.2s;
    }

    .stagger-3 {
      animation-delay: 0.3s;
    }

    .stagger-4 {
      animation-delay: 0.4s;
    }

    /* Gradient backgrounds */
    .hero-gradient {
      background: linear-gradient(135deg, rgba(201, 165, 92, 0.1) 0%, transparent 50%),
        linear-gradient(225deg, rgba(201, 165, 92, 0.05) 0%, transparent 50%);
    }

    .card-shimmer {
      background: linear-gradient(90deg, var(--bg-card) 25%, #2a2a2a 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    /* Focus styles */
    .focus-ring:focus {
      outline: none;
      box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px var(--accent);
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

    // ============================================
    // API CONFIGURATION
    // ============================================
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    // If local, assume backend is on 5001 (default). If deployed, use relative path.
    // However, if we are serving FROM the backend (port 5001), relative path '/api' also works.
    // The issue is likely 'Live Server' (port 5500).
    const API_URL = isLocal ? 'http://localhost:5001/api' : '/api';

    // Image Compression Utility
    const compressImage = (file, maxWidth = 1000, quality = 0.7) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    };

    const simulateLatency = (ms = 300) => new Promise(resolve => setTimeout(resolve, ms));

    const api = {
      // SEARCH: Filters properties locally (kept for performance, using DB data as source)
      async searchProperties(filters = {}, allProperties) {
        await simulateLatency(400);
        let results = [...allProperties];

        if (filters.location && filters.location.trim()) {
          const searchTerm = filters.location.toLowerCase().trim();
          results = results.filter(p =>
            p.location.city.toLowerCase().includes(searchTerm) ||
            p.location.state.toLowerCase().includes(searchTerm) ||
            p.location.address.toLowerCase().includes(searchTerm)
          );
        }

        if (filters.minPrice !== undefined && filters.minPrice !== '') {
          results = results.filter(p => p.price >= Number(filters.minPrice));
        }
        if (filters.maxPrice !== undefined && filters.maxPrice !== '') {
          results = results.filter(p => p.price <= Number(filters.maxPrice));
        }

        if (filters.bedrooms !== undefined && filters.bedrooms !== '' && filters.bedrooms !== 'any') {
          const beds = Number(filters.bedrooms);
          if (beds === 4) {
            results = results.filter(p => p.bedrooms >= 4);
          } else {
            results = results.filter(p => p.bedrooms === beds);
          }
        }

        if (filters.propertyType && filters.propertyType !== 'any') {
          results = results.filter(p => p.propertyType === filters.propertyType);
        }

        results = results.filter(p => p.available);
        results.sort((a, b) => {
          if (a.featured && !b.featured) return -1;
          if (!a.featured && b.featured) return 1;
          return new Date(b.createdAt) - new Date(a.createdAt);
        });

        return { success: true, count: results.length, data: results };
      },

      async getProperty(id, allProperties) {
        await simulateLatency(200);
        const property = allProperties.find(p => p._id === id);
        if (!property) return { success: false, error: 'Property not found' };
        return { success: true, data: property };
      },

      async getFeatured(allProperties) {
        await simulateLatency(300);
        const featured = allProperties.filter(p => p.featured && p.available);
        return { success: true, count: featured.length, data: featured };
      },

      // --- BACKEND CONNECTED CALLS ---

      // Send Contact Message
      async submitContact(data) {
        try {
          const response = await fetch(`${API_URL}/messages`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          return await response.json();
        } catch (e) {
          return { success: false, error: 'Failed to send message' };
        }
      },

      // Submit Job Application
      async submitJobApplication(data) {
        try {
          const response = await fetch(`${API_URL}/job-applications`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          return await response.json();
        } catch (e) {
          return { success: false, error: 'Failed to submit application' };
        }
      },

      // ADMIN: Create Property
      async createProperty(data) {
        try {
          const response = await fetch(`${API_URL}/properties`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          return await response.json();
        } catch (error) {
          return { success: false, error: 'Server error' };
        }
      },

      // ADMIN: Delete Property
      async deleteProperty(id) {
        try {
          await fetch(`${API_URL}/properties/${id}`, { method: 'DELETE' });
          return { success: true };
        } catch (error) {
          return { success: false, error: 'Failed to delete' };
        }
      },

      // ADMIN: Approve Ad
      async approveAd(id) {
        try {
          const response = await fetch(`${API_URL}/pending-ads/${id}/approve`, {
            method: 'POST'
          });
          return await response.json();
        } catch (error) {
          return { success: false, error: 'Failed to approve' };
        }
      },

      // ADMIN: Approve Job
      async approveJob(id) {
        try {
          const response = await fetch(`${API_URL}/pending-jobs/${id}/approve`, {
            method: 'POST'
          });
          return await response.json();
        } catch (error) {
          return { success: false, error: 'Failed to approve' };
        }
      },

      // USER: Submit Pending Ad
      async submitPendingAd(data) {
        try {
          const response = await fetch(`${API_URL}/pending-ads`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          const text = await response.text();
          try {
            const json = JSON.parse(text);
            if (!response.ok) throw new Error(json.error || text || 'Server Error');
            return json;
          } catch (e) {
            throw new Error(text || 'Server Error (Invalid JSON)');
          }
        } catch (error) {
          console.error("Submit Ad Error:", error);
          return { success: false, error: error.message };
        }
      },

      // USER: Submit Pending Job
      async submitPendingJob(data) {
        try {
          const response = await fetch(`${API_URL}/pending-jobs`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          const text = await response.text();
          try {
            const json = JSON.parse(text);
            if (!response.ok) throw new Error(json.error || text || 'Server Error');
            return json;
          } catch (e) {
            throw new Error(text || 'Server Error (Invalid JSON)');
          }
        } catch (error) {
          console.error("Submit Job Error:", error);
          return { success: false, error: error.message };
        }
      },

      // Direct Inquiries (Contact Fee)
      async submitDirectInquiry(data) {
        try {
          const response = await fetch(`${API_URL}/direct-inquiries`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          return await response.json();
        } catch (e) {
          return { success: false, error: 'Failed to submit request' };
        }
      },
      async getDirectInquiry(id) {
        try {
          const response = await fetch(`${API_URL}/direct-inquiries/${id}`);
          return await response.json();
        } catch (e) {
          return { success: false, error: 'Failed to fetch status' };
        }
      },
      async approveDirectInquiry(id) {
        try {
          const response = await fetch(`${API_URL}/direct-inquiries/${id}/approve`, { method: 'POST' });
          return await response.json();
        } catch (e) {
          return { success: false, error: 'Failed to approve' };
        }
      }
    };

    // ============================================
    // CONTEXT
    // ============================================
    const AppContext = createContext();

    const EXCHANGE_RATES = {
      ZMW: { rate: 1, symbol: 'K' },
      USD: { rate: 0.038, symbol: '$' },
      EUR: { rate: 0.035, symbol: '€' },
      GBP: { rate: 0.030, symbol: '£' },
      ZAR: { rate: 0.72, symbol: 'R' },
      UGX: { rate: 140, symbol: 'USh' },
      KES: { rate: 4.9, symbol: 'KSh' },
      RWF: { rate: 52, symbol: 'RF' },
      TZS: { rate: 100, symbol: 'TSh' },
      CDF: { rate: 105, symbol: 'FC' }
    };

    const AppProvider = ({ children }) => {
      const [currentPage, setCurrentPage] = useState('home');
      const [selectedProperty, setSelectedProperty] = useState(null);
      const [searchResults, setSearchResults] = useState([]);
      const [lastSearch, setLastSearch] = useState(null);
      const [isLoading, setIsLoading] = useState(true); // Start loading true
      const [currency, setCurrency] = useState('ZMW');
      const [autoContact, setAutoContact] = useState(false);

      // Admin State
      const [adminLoggedIn, setAdminLoggedIn] = useState(() => {
        return localStorage.getItem('hj_admin_auth') === 'true';
      });

      const handleSetAdminLoggedIn = (val) => {
        setAdminLoggedIn(val);
        if (val) localStorage.setItem('hj_admin_auth', 'true');
        else localStorage.removeItem('hj_admin_auth');
      };
      // MODIFIED: Start with empty arrays, data comes from DB
      const [properties, setProperties] = useState([]);
      const [pendingAds, setPendingAds] = useState([]);

      // --- MODIFIED: Added Jobs State for Admin Workflow ---
      const [jobs, setJobs] = useState([]);
      const [pendingJobs, setPendingJobs] = useState([]);
      const [directInquiries, setDirectInquiries] = useState([]);

      // User Tracking State (Submissions made by this user/browser)
      const [userSubmissions, setUserSubmissions] = useState(() => {
        try {
          const saved = localStorage.getItem('hj_submissions');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });

      // Helper to add a new submission to local tracking
      const trackSubmission = useCallback((id, type, title) => {
        setUserSubmissions(prev => {
          if (prev.find(s => s.id === id)) return prev;
          const updated = [{ id, type, title, status: 'pending', notified: false, createdAt: new Date() }, ...prev];
          localStorage.setItem('hj_submissions', JSON.stringify(updated));
          return updated;
        });
      }, []);

      // Mark confirmed notifications as seen
      const clearNotified = useCallback((id) => {
        setUserSubmissions(prev => {
          const updated = prev.map(s => s.id === id ? { ...s, notified: true } : s);
          localStorage.setItem('hj_submissions', JSON.stringify(updated));
          return updated;
        });
      }, []);

      // Logic to check status of submissions
      useEffect(() => {
        if (isLoading) return;

        let changed = false;
        const updated = userSubmissions.map(sub => {
          if (sub.status === 'confirmed') return sub;

          let isConfirmed = false;
          if (sub.type === 'property') {
            // Check if it exists in live properties
            // We search properties by matching title or description if needed, 
            // but ideally we'd have the live _id. 
            // For now, let's assume if it's NOT in pendingAds anymore and IS in properties (by title match)
            const stillPending = pendingAds.some(p => p._id === sub.id);
            const inLive = properties.some(p => p.title === sub.title);
            if (!stillPending && inLive) isConfirmed = true;
          } else if (sub.type === 'job') {
            const stillPending = pendingJobs.some(j => j._id === sub.id);
            const inLive = jobs.some(j => j.title === sub.title);
            if (!stillPending && inLive) isConfirmed = true;
          } else if (sub.type === 'inquiry') {
            const inquiry = directInquiries.find(i => i._id === sub.id);
            if (inquiry && inquiry.status === 'confirmed') isConfirmed = true;
          }

          if (isConfirmed && sub.status !== 'confirmed') {
            changed = true;
            return { ...sub, status: 'confirmed' };
          }
          return sub;
        });

        if (changed) {
          localStorage.setItem('hj_submissions', JSON.stringify(updated));
          setUserSubmissions(updated);
        }
      }, [properties, pendingAds, jobs, pendingJobs, directInquiries, isLoading]);

      // MODIFIED: Function to refresh data from MongoDB DB
      const refreshData = useCallback(async () => {
        setIsLoading(true);
        try {
          const [propsRes, adsRes, jobsRes, pendingJobsRes, inquiriesRes] = await Promise.all([
            fetch(`${API_URL}/properties`),
            fetch(`${API_URL}/pending-ads`),
            fetch(`${API_URL}/jobs`),
            fetch(`${API_URL}/pending-jobs`),
            fetch(`${API_URL}/direct-inquiries`)
          ]);

          const props = await propsRes.json();
          const ads = await adsRes.json();
          const jobsList = await jobsRes.json();
          const pJobs = await pendingJobsRes.json();
          const inquiries = await inquiriesRes.json();

          setProperties(props);
          setPendingAds(ads);
          setJobs(jobsList);
          setPendingJobs(pJobs);
          setDirectInquiries(inquiries);
        } catch (error) {
          console.error("Failed to fetch data. Is server running?", error);
        } finally {
          setIsLoading(false);
        }
      }, []);

      // Load data on mount
      useEffect(() => {
        refreshData();
      }, [refreshData]);

      const navigateTo = useCallback((page, data = null, shouldContact = false) => {
        setCurrentPage(page);
        setSelectedProperty(data);
        if (shouldContact) setAutoContact(true);
        window.scrollTo(0, 0);
      }, []);
      const formatPrice = useCallback((priceInZMW) => {
        if (priceInZMW === undefined || priceInZMW === null) return '';
        // If it's a string that doesn't look like a number, return as is (e.g. "Negotiable")
        if (typeof priceInZMW === 'string' && isNaN(Number(priceInZMW))) return priceInZMW;

        const numPrice = Number(priceInZMW);
        const rate = EXCHANGE_RATES[currency].rate;
        const symbol = EXCHANGE_RATES[currency].symbol;
        const converted = numPrice * rate;

        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD', // Use USD as fallback for formatting structure, but we manually prepend symbol
          minimumFractionDigits: 0,
          maximumFractionDigits: 0
        }).format(converted).replace('$', symbol);
      }, [currency]);

      return (
        <AppContext.Provider value={{
          currentPage, setCurrentPage,
          selectedProperty, setSelectedProperty,
          searchResults, setSearchResults,
          lastSearch, setLastSearch,
          isLoading, setIsLoading,
          navigateTo,
          // Currency
          currency, setCurrency, formatPrice, EXCHANGE_RATES,
          autoContact, setAutoContact,
          // Admin Props
          adminLoggedIn, setAdminLoggedIn: handleSetAdminLoggedIn,
          properties, setProperties,
          pendingAds, setPendingAds,
          // Job Props
          jobs, setJobs,
          pendingJobs, setPendingJobs,
          directInquiries, setDirectInquiries,
          // User Notifications
          userSubmissions, trackSubmission, clearNotified,
          refreshData // Expose refresh to components
        }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // ============================================
    // ICONS
    // ============================================
    const Icons = {
      Search: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      ),
      Bed: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
      ),
      Bath: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16m-7 6h7" /></svg>
      ),
      Area: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
      ),
      Location: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
      ),
      Arrow: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
      ),
      Close: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
      ),
      Check: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
      ),
      Phone: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
      ),
      Mail: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
      ),
      Home: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
      ),
      Info: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      ),
      Briefcase: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
      ),
      Star: () => (
        <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" /></svg>
      ),
      Trash: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
      ),
      Edit: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
      ),
      Logout: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
      ),
      Bell: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
      ),
      Menu: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>
      ),
      User: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
      ),
      Users: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
      ),
      Quote: () => (
        <svg className="w-8 h-8 opacity-20" fill="currentColor" viewBox="0 0 24 24"><path d="M14.017 21L14.017 18C14.017 16.8954 14.9124 16 16.017 16H19.017C19.5693 16 20.017 15.5523 20.017 15V9C20.017 8.44772 19.5693 8 19.017 8H16.017C15.4647 8 15.017 8.44772 15.017 9V12C15.017 12.5523 14.5693 13 14.017 13H12.017V21H14.017ZM6.017 21L6.017 18C6.017 16.8954 6.91243 16 8.017 16H11.017C11.5693 16 12.017 15.5523 12.017 15V9C12.017 8.44772 11.5693 8 11.017 8H8.017C7.46472 8 7.017 8.44772 7.017 9V12C7.017 12.5523 6.5693 13 6.017 13H4.017V21H6.017Z" /></svg>
      ),
      BookOpen: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
      )
    };

    // ============================================
    // ADMIN COMPONENTS
    // ============================================

    const AdminLogin = () => {
      const { setAdminLoggedIn, navigateTo } = useApp();
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        if (username === 'admin' && password === 'adminn26') {
          setAdminLoggedIn(true);
          navigateTo('admin-dashboard');
        } else {
          setError('Invalid credentials. Please try again.');
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4" style={{ backgroundColor: 'var(--bg-primary)' }}>
          <div className="max-w-md w-full p-8 rounded-xl animate-fade-in-up" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>
            <h2 className="font-display text-2xl font-bold mb-6 text-center" style={{ color: 'var(--fg-primary)' }}>Admin Login</h2>
            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-sm font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Username</label>
                <input
                  type="text"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  className="w-full px-4 py-3 rounded-lg focus-ring"
                  style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border)', color: 'var(--fg-primary)' }}
                  placeholder="Enter username"
                />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Password</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-4 py-3 rounded-lg focus-ring"
                  style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border)', color: 'var(--fg-primary)' }}
                  placeholder="Enter password"
                />
              </div>
              {error && <p className="text-red-500 text-sm">{error}</p>}
              <button type="submit" className="w-full py-3 rounded-lg font-semibold transition-all hover:scale-105" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>
                Log In
              </button>
            </form>
          </div>
        </div>
      );
    };

    const AdminDashboard = () => {
      const {
        navigateTo, setAdminLoggedIn, properties, setProperties,
        pendingAds, setPendingAds, pendingJobs, setPendingJobs,
        jobs, setJobs, directInquiries, refreshData, formatPrice
      } = useApp();
      const [activeTab, setActiveTab] = useState('ads'); // 'ads', 'manage', 'create', 'pending-jobs'
      const [editingProperty, setEditingProperty] = useState(null);

      // Form state for Create/Edit
      const [formData, setFormData] = useState({
        title: '', description: '', price: '', bedrooms: '', bathrooms: '', area: '',
        city: '', state: '', address: '', propertyType: 'apartment', image: ''
      });

      // Reset form
      const resetForm = () => {
        setFormData({
          title: '', description: '', price: '', bedrooms: '', bathrooms: '', area: '',
          city: '', state: '', address: '', propertyType: 'apartment', image: ''
        });
        setEditingProperty(null);
      };

      const handleEditClick = (prop) => {
        setEditingProperty(prop);
        setFormData({
          title: prop.title,
          description: prop.description,
          price: prop.price,
          bedrooms: prop.bedrooms,
          bathrooms: prop.bathrooms,
          area: prop.area,
          city: prop.location.city,
          state: prop.location.state,
          address: prop.location.address,
          propertyType: prop.propertyType,
          image: prop.images[0]
        });
        setActiveTab('create'); // Switch to form view
      };

      const handleDelete = async (id) => {
        if (window.confirm('Are you sure you want to delete this post?')) {
          await api.deleteProperty(id);
          refreshData();
        }
      };

      const handleApproveAd = async (request) => {
        if (window.confirm(`Confirm payment for ${request.advertiserName}?`)) {
          await api.approveAd(request._id);
          alert('Post Confirmed and Uploaded!');
          refreshData();
        }
      };

      const handleApproveJob = async (request) => {
        if (window.confirm(`Confirm payment for job "${request.jobData.title}"?`)) {
          await api.approveJob(request._id);
          alert('Job Confirmed and Uploaded!');
          refreshData();
        }
      };

      const handleSaveProperty = async (e) => {
        e.preventDefault();

        const newProp = {
          title: formData.title,
          description: formData.description,
          price: Number(formData.price),
          bedrooms: Number(formData.bedrooms),
          bathrooms: Number(formData.bathrooms),
          area: Number(formData.area),
          location: {
            address: formData.address,
            city: formData.city,
            state: formData.state,
            zipCode: '00000',
            coordinates: {}
          },
          propertyType: formData.propertyType,
          images: [formData.image || 'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800'],
          amenities: ['Parking', 'Security'], // Default
          available: true,
          featured: false,
          createdAt: new Date()
        };

        if (editingProperty) {
          alert("Update feature not implemented in DB version yet.");
        }

        await api.createProperty(newProp);
        alert('Post Created!');
        resetForm();
        setActiveTab('manage');
        refreshData();
      };

      return (
        <div className="min-h-screen pt-24 pb-16" style={{ backgroundColor: 'var(--bg-primary)' }}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
              <h1 className="font-display text-3xl font-bold" style={{ color: 'var(--fg-primary)' }}>Admin Dashboard</h1>
              <button
                onClick={() => { setAdminLoggedIn(false); navigateTo('home'); }}
                className="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all hover:scale-105"
                style={{ backgroundColor: 'rgba(248, 113, 113, 0.2)', color: 'var(--error)' }}
              >
                <Icons.Logout /> Log Out
              </button>
            </div>

            {/* Tabs */}
            <div className="flex gap-2 mb-6 overflow-x-auto pb-2">
              {[
                { id: 'ads', label: `Prop. Ads (${(pendingAds || []).length})` },
                { id: 'pending-jobs', label: `Job Ads (${(pendingJobs || []).length})` },
                { id: 'contact-fees', label: `Contact Fees (${(directInquiries || []).filter(i => i.status === 'pending').length})` },
                { id: 'manage', label: `Manage Posts (${(properties || []).length})` },
                { id: 'create', label: editingProperty ? 'Edit Post' : 'Add New Post' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => { setActiveTab(tab.id); if (tab.id === 'create' && !editingProperty) resetForm(); }}
                  className={`px-5 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap transition-all ${activeTab === tab.id ? 'shadow-lg' : 'opacity-60 hover:opacity-100'
                    }`}
                  style={{
                    backgroundColor: activeTab === tab.id ? 'var(--accent)' : 'var(--bg-card)',
                    color: activeTab === tab.id ? 'var(--bg-primary)' : 'var(--fg-secondary)',
                    border: activeTab === tab.id ? 'none' : '1px solid var(--border)'
                  }}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* Content Area */}
            <div className="rounded-xl p-6 min-h-[500px]" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>

              {/* TAB 1: Pending Approvals (Properties) */}
              {activeTab === 'ads' && (
                <div className="space-y-4">
                  {(pendingAds || []).length === 0 ? (
                    <div className="text-center py-10" style={{ color: 'var(--fg-muted)' }}>No pending approvals.</div>
                  ) : (
                    (pendingAds || []).map(req => (
                      <div key={req._id} className="p-4 rounded-lg flex flex-col md:flex-row gap-4 justify-between items-start md:items-center" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border)' }}>
                        <div className="flex-1">
                          <h3 className="font-bold text-lg" style={{ color: 'var(--accent)' }}>{req.propertyData.title}</h3>
                          <div className="grid grid-cols-2 gap-x-8 gap-y-2 mt-2 text-sm" style={{ color: 'var(--fg-secondary)' }}>
                            <p><span className="font-medium text-[var(--fg-primary)]">Advertiser:</span> {req.advertiserName}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Phone:</span> {req.advertiserPhone}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Email:</span> {req.advertiserEmail}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Trans ID:</span> {req.transactionId}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Amount:</span> {formatPrice(req.amountPaid)}</p>
                          </div>
                        </div>
                        <div className="flex gap-3 w-full md:w-auto">
                          <button
                            onClick={() => handleApproveAd(req)}
                            className="flex-1 md:flex-none px-6 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition-all hover:scale-105"
                            style={{ backgroundColor: 'var(--success)', color: '#000' }}
                          >
                            <Icons.Check /> Confirm
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {/* TAB 2: Pending Job Approvals */}
              {activeTab === 'pending-jobs' && (
                <div className="space-y-4">
                  {(pendingJobs || []).length === 0 ? (
                    <div className="text-center py-10" style={{ color: 'var(--fg-muted)' }}>No pending job approvals.</div>
                  ) : (
                    (pendingJobs || []).map(req => (
                      <div key={req._id} className="p-4 rounded-lg flex flex-col md:flex-row gap-4 justify-between items-start md:items-center" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border)' }}>
                        <div className="flex-1">
                          <h3 className="font-bold text-lg" style={{ color: 'var(--accent)' }}>{req.jobData.title}</h3>
                          <div className="grid grid-cols-2 gap-x-8 gap-y-2 mt-2 text-sm" style={{ color: 'var(--fg-secondary)' }}>
                            <p><span className="font-medium text-[var(--fg-primary)]">Company:</span> {req.jobData.company}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Advertiser:</span> {req.advertiserName}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Phone:</span> {req.advertiserPhone}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Trans ID:</span> {req.transactionId}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Amount:</span> {formatPrice(req.amountPaid)}</p>
                          </div>
                        </div>
                        <div className="flex gap-3 w-full md:w-auto">
                          <button
                            onClick={() => handleApproveJob(req)}
                            className="flex-1 md:flex-none px-6 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition-all hover:scale-105"
                            style={{ backgroundColor: 'var(--success)', color: '#000' }}
                          >
                            <Icons.Check /> Confirm Job
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {/* TAB: Contact Fees */}
              {activeTab === 'contact-fees' && (
                <div className="space-y-4">
                  {(directInquiries || []).length === 0 ? (
                    <div className="text-center py-10" style={{ color: 'var(--fg-muted)' }}>No contact fee requests.</div>
                  ) : (
                    (directInquiries || []).map(req => (
                      <div key={req._id} className="p-4 rounded-lg flex flex-col md:flex-row gap-4 justify-between items-start md:items-center" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border)' }}>
                        <div className="flex-1">
                          <h3 className="font-bold text-lg" style={{ color: 'var(--accent)' }}>Contact for: {req.propertyTitle}</h3>
                          <div className="grid grid-cols-2 gap-x-8 gap-y-2 mt-2 text-sm" style={{ color: 'var(--fg-secondary)' }}>
                            <p><span className="font-medium text-[var(--fg-primary)]">User:</span> {req.name}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Phone:</span> {req.phone}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Email:</span> {req.email}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Trans ID:</span> {req.transactionId}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Amount:</span> <span className="font-bold" style={{ color: 'var(--accent)' }}>{formatPrice(req.amount || 0)}</span></p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Provider:</span> {(req.provider || '').toUpperCase()}</p>
                            <p><span className="font-medium text-[var(--fg-primary)]">Status:</span> <span style={{ color: req.status === 'confirmed' ? 'var(--success)' : 'var(--warning)' }}>{req.status}</span></p>
                            {req.message && <p className="col-span-2 mt-2 p-2 rounded bg-black/20 italic" style={{ color: 'var(--fg-secondary)' }}><span className="font-bold text-[var(--fg-primary)] not-italic">Message:</span> {req.message}</p>}
                          </div>
                        </div>
                        {req.status === 'pending' && (
                          <div className="flex gap-3 w-full md:w-auto">
                            <button
                              onClick={async () => {
                                if (window.confirm('Confirm this contact fee payment?')) {
                                  const res = await api.approveDirectInquiry(req._id);
                                  if (res.success) {
                                    alert('Payment Confirmed!');
                                    refreshData();
                                  }
                                }
                              }}
                              className="px-6 py-2 rounded-lg text-sm font-semibold flex items-center gap-2"
                              style={{ backgroundColor: 'var(--success)', color: '#000' }}
                            >
                              <Icons.Check /> Confirm Payment
                            </button>
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>
              )}

              {/* TAB 3: Manage Posts */}
              {activeTab === 'manage' && (
                <div>
                  {/* Table for Desktop */}
                  <div className="hidden md:block overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead>
                        <tr style={{ borderBottom: '1px solid var(--border)', color: 'var(--fg-muted)' }}>
                          <th className="pb-3 pl-2">Title</th>
                          <th className="pb-3">Price</th>
                          <th className="pb-3">Location</th>
                          <th className="pb-3">Type</th>
                          <th className="pb-3 text-right pr-2">Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        {properties.map(prop => (
                          <tr key={prop._id} className="border-b border-[var(--border)] last:border-0 hover:bg-[var(--bg-secondary)] transition-colors">
                            <td className="py-3 pl-2 font-medium" style={{ color: 'var(--fg-primary)' }}>{prop.title}</td>
                            <td className="py-3" style={{ color: 'var(--accent)' }}>{formatPrice(prop.price)}</td>
                            <td className="py-3" style={{ color: 'var(--fg-secondary)' }}>{prop.location.city}, {prop.location.state}</td>
                            <td className="py-3 capitalize" style={{ color: 'var(--fg-secondary)' }}>{prop.propertyType}</td>
                            <td className="py-3 text-right pr-2 flex justify-end gap-2">
                              <button onClick={() => handleEditClick(prop)} className="p-2 rounded hover:bg-[var(--bg-card)] text-blue-400" title="Edit"><Icons.Edit /></button>
                              <button onClick={() => handleDelete(prop._id)} className="p-2 rounded hover:bg-[var(--bg-card)] text-red-400" title="Delete"><Icons.Trash /></button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* Cards for Mobile */}
                  <div className="md:hidden space-y-3">
                    {properties.map(prop => (
                      <div key={prop._id} className="p-4 rounded-lg space-y-3" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border)' }}>
                        <div className="flex justify-between items-start">
                          <h3 className="font-bold text-[var(--fg-primary)]">{prop.title}</h3>
                          <span className="font-bold" style={{ color: 'var(--accent)' }}>{formatPrice(prop.price)}</span>
                        </div>
                        <div className="flex justify-between items-center text-xs" style={{ color: 'var(--fg-muted)' }}>
                          <span>{prop.location.city}, {prop.location.state}</span>
                          <span className="capitalize">{prop.propertyType}</span>
                        </div>
                        <div className="flex justify-end gap-3 pt-2 border-t border-[var(--border)]">
                          <button onClick={() => handleEditClick(prop)} className="flex items-center gap-2 px-3 py-1.5 rounded bg-blue-500/10 text-blue-400 text-xs font-medium"><Icons.Edit /> Edit</button>
                          <button onClick={() => handleDelete(prop._id)} className="flex items-center gap-2 px-3 py-1.5 rounded bg-red-500/10 text-red-400 text-xs font-medium"><Icons.Trash /> Delete</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 4: Create/Edit Form */}
              {activeTab === 'create' && (
                <form onSubmit={handleSaveProperty} className="max-w-2xl mx-auto space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Property Title</label>
                      <input required value={formData.title} onChange={e => setFormData({ ...formData, title: e.target.value })} className="w-full px-4 py-2 rounded-lg bg-[var(--bg-secondary)] border-[var(--border)] text-[var(--fg-primary)]" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Property Type</label>
                      <select value={formData.propertyType} onChange={e => setFormData({ ...formData, propertyType: e.target.value })} className="w-full px-4 py-2 rounded-lg bg-[var(--bg-secondary)] border-[var(--border)] text-[var(--fg-primary)]">
                        <option value="apartment">Apartment</option>
                        <option value="house">House</option>
                        <option value="condo">Condo</option>
                        <option value="studio">Studio</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Price</label>
                      <input required type="number" value={formData.price} onChange={e => setFormData({ ...formData, price: e.target.value })} className="w-full px-4 py-2 rounded-lg bg-[var(--bg-secondary)] border-[var(--border)] text-[var(--fg-primary)]" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Area (sqft)</label>
                      <input required type="number" value={formData.area} onChange={e => setFormData({ ...formData, area: e.target.value })} className="w-full px-4 py-2 rounded-lg bg-[var(--bg-secondary)] border-[var(--border)] text-[var(--fg-primary)]" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Bedrooms</label>
                      <input required type="number" value={formData.bedrooms} onChange={e => setFormData({ ...formData, bedrooms: e.target.value })} className="w-full px-4 py-2 rounded-lg bg-[var(--bg-secondary)] border-[var(--border)] text-[var(--fg-primary)]" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Bathrooms</label>
                      <input required type="number" step="0.5" value={formData.bathrooms} onChange={e => setFormData({ ...formData, bathrooms: e.target.value })} className="w-full px-4 py-2 rounded-lg bg-[var(--bg-secondary)] border-[var(--border)] text-[var(--fg-primary)]" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>City</label>
                      <input required value={formData.city} onChange={e => setFormData({ ...formData, city: e.target.value })} className="w-full px-4 py-2 rounded-lg bg-[var(--bg-secondary)] border-[var(--border)] text-[var(--fg-primary)]" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>State/Province</label>
                      <input required value={formData.state} onChange={e => setFormData({ ...formData, state: e.target.value })} className="w-full px-4 py-2 rounded-lg bg-[var(--bg-secondary)] border-[var(--border)] text-[var(--fg-primary)]" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Address</label>
                    <input required value={formData.address} onChange={e => setFormData({ ...formData, address: e.target.value })} className="w-full px-4 py-2 rounded-lg bg-[var(--bg-secondary)] border-[var(--border)] text-[var(--fg-primary)]" />
                  </div>
                  <div>
                    <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Property Image</label>
                    <div className="flex flex-col gap-2">
                      <input
                        type="file"
                        accept="image/*"
                        onChange={async (e) => {
                          const file = e.target.files[0];
                          if (file) {
                            const compressed = await compressImage(file);
                            setFormData({ ...formData, image: compressed });
                          }
                        }}
                        className="w-full px-4 py-2 rounded-lg bg-[var(--bg-secondary)] border-[var(--border)] text-[var(--fg-primary)] text-sm"
                      />
                      {formData.image && (
                        <div className="relative w-20 h-20 rounded-lg overflow-hidden border border-[var(--border)]">
                          <img src={formData.image} alt="Preview" className="w-full h-full object-cover" />
                          <button
                            type="button"
                            onClick={() => setFormData({ ...formData, image: '' })}
                            className="absolute top-0 right-0 bg-red-500 text-white p-0.5 rounded-bl-lg hover:bg-red-600 transition-colors"
                          >
                            <Icons.Close />
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Description</label>
                    <textarea required rows="4" value={formData.description} onChange={e => setFormData({ ...formData, description: e.target.value })} className="w-full px-4 py-2 rounded-lg bg-[var(--bg-secondary)] border-[var(--border)] text-[var(--fg-primary)] resize-none"></textarea>
                  </div>
                  <div className="flex gap-3 pt-4">
                    <button type="button" onClick={() => { resetForm(); setActiveTab('manage'); }} className="px-6 py-2 rounded-lg text-sm font-medium bg-[var(--bg-secondary)] text-[var(--fg-secondary)] border border-[var(--border)]">Cancel</button>
                    <button type="submit" className="flex-1 px-6 py-2 rounded-lg text-sm font-semibold transition-all hover:scale-105" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>
                      {editingProperty ? 'Update Post' : 'Upload Post'}
                    </button>
                  </div>
                </form>
              )}

            </div>
          </div>
        </div>
      );
    };

    // ============================================
    // ADVERTISE PROPERTY MODAL
    // ============================================
    const AdvertisePropertyModal = ({ onClose }) => {
      const { formatPrice, trackSubmission } = useApp();
      const [step, setStep] = useState(1);
      const [formData, setFormData] = useState({
        advertiserName: '', advertiserPhone: '', advertiserEmail: '',
        title: '', description: '', price: '', city: '', image: ''
      });
      const [payment, setPayment] = useState({ provider: 'mtn', transactionId: '' });
      const [loading, setLoading] = useState(false);

      const submitAd = async (e) => {
        e.preventDefault();
        setLoading(true);

        const newRequest = {
          _id: 'req_' + Date.now(),
          advertiserName: formData.advertiserName,
          advertiserPhone: formData.advertiserPhone,
          advertiserEmail: formData.advertiserEmail,
          transactionId: payment.transactionId,
          amountPaid: 100,
          paymentDate: new Date(),
          propertyData: {
            title: formData.title,
            description: formData.description,
            location: { address: 'Address Provided by User', city: formData.city, state: 'Unknown', zipCode: '00000', coordinates: {} },
            price: Number(formData.price),
            bedrooms: 2,
            bathrooms: 1,
            area: 1000,
            propertyType: 'apartment',
            amenities: [],
            images: [formData.image || 'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800'],
            featured: false,
            available: true
          }
        };

        // Call Backend API
        const result = await api.submitPendingAd(newRequest);

        setLoading(false);

        if (result.success) {
          trackSubmission(newRequest._id, 'property', newRequest.propertyData.title);
          setStep(3);
        } else {
          alert('Failed to submit ad: ' + (result.error || 'Server error'));
        }
      };

      if (step === 3) return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.8)' }}>
          <div className="rounded-xl p-8 max-w-md w-full text-center animate-fade-in-up" style={{ backgroundColor: 'var(--bg-card)' }}>
            <div className="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4" style={{ backgroundColor: 'rgba(74, 222, 128, 0.2)', color: 'var(--success)' }}><svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg></div>
            <h2 className="font-display text-2xl font-bold mb-2" style={{ color: 'var(--fg-primary)' }}>Payment Received!</h2>
            <p className="mb-6" style={{ color: 'var(--fg-secondary)' }}>Your property post has been sent to the admin for confirmation.</p>
            <button onClick={onClose} className="px-6 py-3 rounded-lg font-medium w-full" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>Close</button>
          </div>
        </div>
      );

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto" style={{ backgroundColor: 'rgba(0,0,0,0.8)' }}>
          <div className="rounded-xl p-6 max-w-lg w-full my-8 animate-fade-in-up relative" style={{ backgroundColor: 'var(--bg-card)' }}>
            <button onClick={onClose} className="absolute top-4 right-4 p-2 rounded-full hover:bg-white/10"><Icons.Close /></button>
            <h2 className="font-display text-2xl font-bold mb-1" style={{ color: 'var(--fg-primary)' }}>{step === 1 ? 'Post a Property' : 'Pay for Listing'}</h2>

            {step === 1 ? (
              <form onSubmit={(e) => { e.preventDefault(); setStep(2); }}>
                <div className="space-y-4">
                  <h3 className="text-xs uppercase tracking-wider font-bold mb-2" style={{ color: 'var(--fg-muted)' }}>Your Details</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Your Name</label><input required value={formData.advertiserName} onChange={e => setFormData({ ...formData, advertiserName: e.target.value })} type="text" className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} /></div>
                    <div><label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Phone Number</label><input required value={formData.advertiserPhone} onChange={e => setFormData({ ...formData, advertiserPhone: e.target.value })} type="tel" className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} /></div>
                  </div>
                  <div><label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Email Address</label><input required value={formData.advertiserEmail} onChange={e => setFormData({ ...formData, advertiserEmail: e.target.value })} type="email" className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} /></div>

                  <h3 className="text-xs uppercase tracking-wider font-bold mb-2 mt-4" style={{ color: 'var(--fg-muted)' }}>Property Details</h3>
                  <div><label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Property Title</label><input required value={formData.title} onChange={e => setFormData({ ...formData, title: e.target.value })} type="text" className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} placeholder="e.g. 2 Bedroom Apartment" /></div>
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Price</label><input required value={formData.price} onChange={e => setFormData({ ...formData, price: e.target.value })} type="number" className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} /></div>
                    <div><label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>City</label><input required value={formData.city} onChange={e => setFormData({ ...formData, city: e.target.value })} type="text" className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} /></div>
                  </div>
                  <div><label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Description</label><textarea required value={formData.description} onChange={e => setFormData({ ...formData, description: e.target.value })} rows="3" className="w-full px-4 py-3 rounded-lg text-sm focus-ring resize-none" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }}></textarea></div>
                  <div>
                    <label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Property Image</label>
                    <div className="flex flex-col gap-2">
                      <input
                        type="file"
                        accept="image/*"
                        onChange={async (e) => {
                          const file = e.target.files[0];
                          if (file) {
                            const compressed = await compressImage(file);
                            setFormData({ ...formData, image: compressed });
                          }
                        }}
                        className="w-full px-4 py-3 rounded-lg text-sm focus-ring"
                        style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }}
                      />
                      {formData.image && (
                        <div className="relative w-24 h-24 rounded-lg overflow-hidden border border-[var(--border)]">
                          <img src={formData.image} alt="Preview" className="w-full h-full object-cover" />
                          <button
                            type="button"
                            onClick={() => setFormData({ ...formData, image: '' })}
                            className="absolute top-0 right-0 bg-red-500 text-white p-1 rounded-bl-lg hover:bg-red-600 transition-colors"
                          >
                            <Icons.Close />
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
                <div className="mt-6 flex gap-3">
                  <button type="button" onClick={onClose} className="flex-1 px-4 py-3 rounded-lg font-medium text-sm" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-secondary)' }}>Cancel</button>
                  <button type="submit" className="flex-1 px-4 py-3 rounded-lg font-semibold text-sm transition-all hover:scale-105" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>Proceed to Payment</button>
                </div>
              </form>
            ) : (
              <form onSubmit={submitAd}>
                <div className="space-y-4 mb-6">
                  <div className="flex gap-4">
                    <label className="flex-1 cursor-pointer"><input type="radio" name="provider" value="mtn" checked={payment.provider === 'mtn'} onChange={e => setPayment({ ...payment, provider: e.target.value })} className="peer sr-only" /><div className="p-4 rounded-lg border-2 text-center peer-checked:border-[#fbbf24] peer-checked:bg-[#fbbf24]/10 transition-all" style={{ borderColor: 'var(--border)' }}><div className="font-bold text-yellow-400">MTN Mobile Money</div></div></label>
                    <label className="flex-1 cursor-pointer"><input type="radio" name="provider" value="airtel" checked={payment.provider === 'airtel'} onChange={e => setPayment({ ...payment, provider: e.target.value })} className="peer sr-only" /><div className="p-4 rounded-lg border-2 text-center peer-checked:border-red-500 peer-checked:bg-red-500/10 transition-all" style={{ borderColor: 'var(--border)' }}><div className="font-bold text-red-500">Airtel Money</div></div></label>
                  </div>
                  <div className="p-4 rounded-lg text-center" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border)' }}>
                    <p className="text-sm mb-1" style={{ color: 'var(--fg-muted)' }}>Agent Name</p><p className="font-bold text-lg" style={{ color: 'var(--fg-primary)' }}>{payment.provider === 'mtn' ? 'John Banda' : 'Mary Phiri'}</p>
                    <p className="text-sm mb-1 mt-2" style={{ color: 'var(--fg-muted)' }}>Agent Number</p><p className="font-mono text-xl font-bold" style={{ color: 'var(--accent)' }}>{payment.provider === 'mtn' ? '0976 123 456' : '0977 987 654'}</p>
                    <p className="text-xs mt-2 text-[#4ade80]">Amount: {formatPrice(100)} (Posting Fee)</p>
                  </div>
                  <div><label className="block text-xs font-medium mb-1" style={{ color: 'var(--fg-secondary)' }}>Transaction ID</label><input required name="transactionId" value={payment.transactionId} onChange={e => setPayment({ ...payment, transactionId: e.target.value })} type="text" placeholder="e.g. 1234567890" className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} /></div>
                </div>
                <div className="mt-6 flex gap-3">
                  <button type="button" onClick={() => setStep(1)} className="flex-1 px-4 py-3 rounded-lg font-medium text-sm" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-secondary)' }}>Back</button>
                  <button type="submit" disabled={loading} className="flex-1 px-4 py-3 rounded-lg font-semibold text-sm transition-all hover:scale-105 disabled:opacity-50" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>{loading ? 'Confirming...' : 'Confirm & Post'}</button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    };

    // ============================================
    // EXISTING COMPONENTS (Unchanged core logic)
    // ============================================

    const PropertySkeleton = () => (
      <div className="rounded-xl overflow-hidden" style={{ backgroundColor: 'var(--bg-card)' }}>
        <div className="h-56 card-shimmer"></div>
        <div className="p-5">
          <div className="h-6 rounded card-shimmer mb-3 w-3/4"></div>
          <div className="h-4 rounded card-shimmer mb-4 w-1/2"></div>
          <div className="flex gap-4 mb-4">
            <div className="h-4 rounded card-shimmer w-16"></div>
            <div className="h-4 rounded card-shimmer w-16"></div>
            <div className="h-4 rounded card-shimmer w-20"></div>
          </div>
          <div className="h-8 rounded card-shimmer w-1/3"></div>
        </div>
      </div>
    );

    const Header = () => {
      const {
        currentPage, navigateTo, adminLoggedIn, setAdminLoggedIn,
        currency, setCurrency, EXCHANGE_RATES,
        userSubmissions, clearNotified
      } = useApp();
      const [scrolled, setScrolled] = useState(false);
      const [showNotifications, setShowNotifications] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const unnotifiedCount = userSubmissions.filter(s => s.status === 'confirmed' && !s.notified).length;

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 50);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <header
          className={`fixed top-0 left-0 right-0 z-40 transition-all duration-300 ${scrolled ? 'py-3' : 'py-5'}`}
          style={{ backgroundColor: scrolled ? 'rgba(15, 15, 15, 0.95)' : 'transparent', backdropFilter: scrolled ? 'blur(10px)' : 'none', borderBottom: scrolled ? '1px solid var(--border)' : 'none' }}
        >
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between">
              <button onClick={() => navigateTo('home')} className="flex items-center gap-2 focus-ring rounded">
                <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{ backgroundColor: 'var(--accent)' }}>
                  <span className="font-display text-xl font-bold" style={{ color: 'var(--bg-primary)' }}>H</span>
                </div>
                <span className="font-display text-lg sm:text-xl font-semibold" style={{ color: 'var(--fg-primary)' }}>H&JNest</span>
              </button>

              <nav className="hidden md:flex items-center gap-8">
                <button onClick={() => navigateTo('home')} className={`text-sm font-medium transition-colors hover:opacity-80 focus-ring rounded px-2 py-1 ${currentPage === 'home' ? 'text-[var(--accent)]' : 'text-[var(--fg-secondary)]'}`}>Home</button>
                <button onClick={() => navigateTo('search')} className={`text-sm font-medium transition-colors hover:opacity-80 focus-ring rounded px-2 py-1 ${currentPage === 'search' ? 'text-[var(--accent)]' : 'text-[var(--fg-secondary)]'}`}>Browse</button>
                <button onClick={() => navigateTo('about')} className={`text-sm font-medium transition-colors hover:opacity-80 focus-ring rounded px-2 py-1 ${currentPage === 'about' ? 'text-[var(--accent)]' : 'text-[var(--fg-secondary)]'}`}>About</button>
                <button onClick={() => navigateTo('jobs')} className={`text-sm font-medium transition-colors hover:opacity-80 focus-ring rounded px-2 py-1 ${currentPage === 'jobs' ? 'text-[var(--accent)]' : 'text-[var(--fg-secondary)]'}`}>Jobs</button>
                <button onClick={() => navigateTo('blog')} className={`text-sm font-medium transition-colors hover:opacity-80 focus-ring rounded px-2 py-1 ${currentPage === 'blog' ? 'text-[var(--accent)]' : 'text-[var(--fg-secondary)]'}`}>Blog</button>
              </nav>

              <div className="flex items-center gap-4">
                {/* Notifications - Hidden on Mobile, shown on Desktop */}
                <div className="hidden md:block relative">
                  <button
                    onClick={() => setShowNotifications(!showNotifications)}
                    className="relative p-2 rounded-full hover:bg-white/10 transition-colors"
                    style={{ color: 'var(--fg-secondary)' }}
                  >
                    <Icons.Bell />
                    {unnotifiedCount > 0 && (
                      <span className="absolute top-1 right-1 w-4 h-4 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center border-2 border-[var(--bg-primary)]">
                        {unnotifiedCount}
                      </span>
                    )}
                  </button>

                  {showNotifications && (
                    <div className="absolute right-0 mt-2 w-72 sm:w-80 max-h-[400px] overflow-y-auto rounded-xl shadow-2xl p-4 animate-fade-in z-50 ring-1 ring-white/10" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>
                      <h3 className="font-bold mb-4 flex justify-between items-center" style={{ color: 'var(--fg-primary)' }}>
                        Notifications
                        <button onClick={() => setShowNotifications(false)} className="text-xs font-normal opacity-50">Close</button>
                      </h3>
                      <div className="space-y-3">
                        {userSubmissions.length === 0 ? (
                          <p className="text-center py-4 text-sm" style={{ color: 'var(--fg-muted)' }}>No notifications yet</p>
                        ) : (
                          userSubmissions.map((sub, idx) => (
                            <div
                              key={sub.id || idx}
                              className={`p-3 rounded-lg text-sm transition-colors cursor-pointer border border-transparent ${sub.status === 'confirmed' && !sub.notified ? 'border-l-4 border-l-[var(--accent)] bg-white/5 border-[var(--border)]' : 'bg-black/20 opacity-70'}`}
                              onClick={() => { if (sub.status === 'confirmed') clearNotified(sub.id); }}
                            >
                              <div className="flex justify-between items-start mb-1">
                                <span className="font-bold text-[10px] uppercase tracking-wider" style={{ color: sub.status === 'confirmed' ? 'var(--success)' : 'var(--warning)' }}>
                                  {sub.status === 'confirmed' ? '✓ Confirmed' : '• Pending'}
                                </span>
                                <span className="text-[10px]" style={{ color: 'var(--fg-muted)' }}>
                                  {sub.createdAt ? new Date(sub.createdAt).toLocaleDateString() : 'Just now'}
                                </span>
                              </div>
                              <p className="text-xs" style={{ color: 'var(--fg-primary)' }}>
                                Your {sub.type} <strong>{sub.title}</strong> {sub.status === 'confirmed' ? 'is now live!' : 'has been sent for review.'}
                              </p>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}
                </div>

                {/* Currency Selector */}
                <div className="relative group">
                  <select
                    value={currency}
                    onChange={(e) => setCurrency(e.target.value)}
                    className="appearance-none bg-transparent text-sm font-medium px-2 py-1 rounded cursor-pointer focus:outline-none"
                    style={{ color: 'var(--fg-primary)', border: '1px solid var(--border)', backgroundColor: 'var(--bg-card)' }}
                  >
                    {Object.keys(EXCHANGE_RATES).map(curr => (
                      <option key={curr} value={curr}>{EXCHANGE_RATES[curr].symbol} {curr}</option>
                    ))}
                  </select>
                </div>

                {!adminLoggedIn ? (
                  <button onClick={() => navigateTo('login')} className="hidden md:block text-sm font-medium px-4 py-2 rounded-lg border border-[var(--border)] hover:bg-[var(--bg-card)] transition-colors" style={{ color: 'var(--fg-primary)' }}>Log In</button>
                ) : (
                  <button onClick={() => navigateTo('admin-dashboard')} className="hidden md:block text-sm font-medium px-4 py-2 rounded-lg transition-colors" style={{ color: 'var(--accent)' }}>Dashboard</button>
                )}

                {/* Mobile Admin Icon */}
                <button
                  onClick={() => navigateTo(adminLoggedIn ? 'admin-dashboard' : 'login')}
                  className="md:hidden p-2 rounded-lg hover:bg-white/10 transition-colors"
                  style={{ color: adminLoggedIn ? 'var(--accent)' : 'var(--fg-secondary)' }}
                  aria-label={adminLoggedIn ? "Admin Dashboard" : "Admin Login"}
                >
                  <Icons.User />
                </button>
