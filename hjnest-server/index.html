            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">{jobs.map((job, index) => <JobCard key={job._id} job={job} onApply={setSelectedJob} />)}</div>
          </div>
          {selectedJob && <JobApplicationModal job={selectedJob} onClose={() => setSelectedJob(null)} />}
          {showAdvertiseModal && <AdvertiseJobModal onClose={() => setShowAdvertiseModal(false)} />}
        </div>
      );
    };

    const SearchBar = ({ variant = 'hero', onSearch, initialValues = {} }) => {
      const { formatPrice } = useApp();
      const [location, setLocation] = useState(initialValues.location || '');
      const [minPrice, setMinPrice] = useState(initialValues.minPrice || '');
      const [maxPrice, setMaxPrice] = useState(initialValues.maxPrice || '');
      const [bedrooms, setBedrooms] = useState(initialValues.bedrooms || 'any');

      const handleSearch = async (e) => {
        e.preventDefault();
        if (onSearch) onSearch({ location, minPrice, maxPrice, bedrooms });
      };

      const isHero = variant === 'hero';

      return (
        <form onSubmit={handleSearch} className={`w-full ${isHero ? 'max-w-4xl mx-auto' : ''}`}>
          <div className={`rounded-2xl ${isHero ? 'p-6 sm:p-8' : 'p-4 sm:p-5'}`} style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="relative">
                <label className="block text-xs font-medium mb-2" style={{ color: 'var(--fg-muted)' }}>Location</label>
                <div className="relative">
                  <span className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: 'var(--fg-muted)' }}><Icons.Location /></span>
                  <input type="text" placeholder="City, state, or address" value={location} onChange={e => setLocation(e.target.value)} className="w-full pl-11 pr-4 py-3 rounded-lg text-sm focus-ring transition-all" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} />
                </div>
              </div>
              <div>
                <label className="block text-xs font-medium mb-2" style={{ color: 'var(--fg-muted)' }}>Min Price</label>
                <select value={minPrice} onChange={e => setMinPrice(e.target.value)} className="w-full px-4 py-3 rounded-lg text-sm focus-ring transition-all appearance-none cursor-pointer" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }}>
                  <option value="">No min</option>
                  {[1000, 2000, 3000, 5000, 7500, 10000].map(val => (
                    <option key={val} value={val}>{formatPrice(val)}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs font-medium mb-2" style={{ color: 'var(--fg-muted)' }}>Max Price</label>
                <select value={maxPrice} onChange={e => setMaxPrice(e.target.value)} className="w-full px-4 py-3 rounded-lg text-sm focus-ring transition-all appearance-none cursor-pointer" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }}>
                  <option value="">No max</option>
                  {[2000, 3000, 5000, 7500, 10000, 15000].map(val => (
                    <option key={val} value={val}>{formatPrice(val)}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs font-medium mb-2" style={{ color: 'var(--fg-muted)' }}>Bedrooms</label>
                <select value={bedrooms} onChange={e => setBedrooms(e.target.value)} className="w-full px-4 py-3 rounded-lg text-sm focus-ring transition-all appearance-none cursor-pointer" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }}><option value="any">Any</option><option value="0">Studio</option><option value="1">1 Bedroom</option><option value="2">2 Bedrooms</option><option value="3">3 Bedrooms</option><option value="4">4+ Bedrooms</option></select>
              </div>
            </div>
            <div className="mt-5 flex flex-col sm:flex-row gap-3 justify-center">
              <button type="submit" className="flex items-center justify-center gap-2 px-8 py-3.5 rounded-lg font-semibold text-sm transition-all hover:scale-105 focus-ring" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}><Icons.Search /> Search Properties</button>
              {variant === 'results' && <button type="button" onClick={() => { setLocation(''); setMinPrice(''); setMaxPrice(''); setBedrooms('any'); }} className="px-6 py-3.5 rounded-lg font-medium text-sm transition-all hover:opacity-80 focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-secondary)', border: '1px solid var(--border)' }}>Clear Filters</button>}
            </div>
          </div>
        </form>
      );
    };

    const PropertyCard = ({ property, index }) => {
      const { navigateTo, formatPrice } = useApp();
      const [imageLoaded, setImageLoaded] = useState(false);
      // const formatPrice = (price) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'ZMW', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(price);
      const bedroomLabel = property.bedrooms === 0 ? 'Studio' : `${property.bedrooms} Bed`;
      return (
        <article className="group rounded-xl overflow-hidden transition-all duration-300 hover:translate-y-[-4px] animate-fade-in-up cursor-pointer" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)', animationDelay: `${index * 0.1}s`, opacity: 0 }} onClick={() => navigateTo('property', property)} tabIndex={0} role="button" aria-label={`View ${property.title}`} onKeyPress={e => e.key === 'Enter' && navigateTo('property', property)}>
          <div className="relative h-56 overflow-hidden">
            {!imageLoaded && <div className="absolute inset-0 card-shimmer"></div>}
            <img src={property.images[0]} alt={property.title} className={`w-full h-full object-cover transition-all duration-500 group-hover:scale-110 ${imageLoaded ? 'opacity-100' : 'opacity-0'}`} onLoad={() => setImageLoaded(true)} />
            {property.featured && <div className="absolute top-3 left-3 px-3 py-1.5 rounded-full text-xs font-semibold" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>Featured</div>}
            <div className="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity" style={{ background: 'linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 50%)' }}></div>
          </div>
          <div className="p-5">
            <div className="flex items-start justify-between mb-2">
              <h3 className="font-display text-lg font-semibold line-clamp-1 group-hover:text-[#c9a55c] transition-colors" style={{ color: 'var(--fg-primary)' }}>{property.title}</h3>
            </div>
            <div className="flex items-center gap-1.5 mb-3" style={{ color: 'var(--fg-muted)' }}><Icons.Location /><span className="text-sm">{property.location.city}, {property.location.state}</span></div>
            <div className="flex items-center gap-4 mb-4 text-sm" style={{ color: 'var(--fg-secondary)' }}>
              <div className="flex items-center gap-1.5"><Icons.Bed /><span>{bedroomLabel}</span></div>
              <div className="flex items-center gap-1.5"><Icons.Bath /><span>{property.bathrooms} Bath</span></div>
              <div className="flex items-center gap-1.5"><Icons.Area /><span>{property.area.toLocaleString()} sqft</span></div>
            </div>
            <div className="flex items-center justify-between pt-4" style={{ borderTop: '1px solid var(--border)' }}>
              <div><span className="font-display text-2xl font-bold" style={{ color: 'var(--accent)' }}>{formatPrice(property.price)}</span><span className="text-sm ml-1" style={{ color: 'var(--fg-muted)' }}>/mo</span></div>
              <span className="text-sm font-medium group-hover:underline transition-all" style={{ color: 'var(--accent)' }}>View Details</span>
            </div>
          </div>
        </article>
      );
    };

    const Hero = () => {
      const { navigateTo, setSearchResults, setIsLoading, setLastSearch, properties } = useApp();
      const [isVisible, setIsVisible] = useState(false);
      useEffect(() => setIsVisible(true), []);

      const handleSearch = async (filters) => {
        setIsLoading(true);
        const results = await api.searchProperties(filters, properties);
        setSearchResults(results.data);
        setLastSearch(filters);
        setIsLoading(false);
        navigateTo('search');
      };

      return (
        <section className="relative min-h-screen flex items-center justify-center hero-gradient pt-20">
          <div className="absolute inset-0 overflow-hidden">
            <div className="absolute top-1/4 left-1/4 w-96 h-96 rounded-full opacity-20 blur-3xl" style={{ backgroundColor: 'var(--accent)' }}></div>
            <div className="absolute bottom-1/4 right-1/4 w-64 h-64 rounded-full opacity-10 blur-3xl" style={{ backgroundColor: 'var(--accent)' }}></div>
          </div>
          <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
            <div className="text-center mb-12">
              <h1 className={`font-display text-4xl sm:text-5xl lg:text-6xl font-bold mb-6 transition-all duration-700 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`} style={{ color: 'var(--fg-primary)' }}>Find Your Perfect Job<br /><span style={{ color: 'var(--accent)' }}>&Rental Home</span></h1>
              <p className={`text-lg sm:text-xl max-w-2xl mx-auto transition-all duration-700 delay-200 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`} style={{ color: 'var(--fg-secondary)' }}>Discover thousands of rental properties across the country. From cozy studios to luxury estates, your next home,dream job is waiting.</p>
            </div>
            <div className={`transition-all duration-700 delay-400 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}><SearchBar variant="hero" onSearch={handleSearch} /></div>
            <div className={`grid grid-cols-2 sm:grid-cols-4 gap-6 mt-16 transition-all duration-700 delay-600 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}>
              {[{ value: '12K+', label: 'Properties' }, { value: '8K+', label: 'Happy Renters' }, { value: '50+', label: 'Cities' }, { value: '4.9', label: 'Avg Rating' }].map((stat, i) => (
                <div key={i} className="text-center"><div className="font-display text-3xl sm:text-4xl font-bold mb-1" style={{ color: 'var(--accent)' }}>{stat.value}</div><div className="text-sm" style={{ color: 'var(--fg-muted)' }}>{stat.label}</div></div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const FeaturedProperties = () => {
      const [properties, setProperties] = useState([]);
      const [loading, setLoading] = useState(true);
      const { navigateTo } = useApp();

      const { properties: allProperties } = useApp();

      useEffect(() => {
        const featured = allProperties.filter(p => p.featured && p.available);
        setProperties(featured);
        setLoading(false);
      }, [allProperties]);

      return (
        <section className="py-24" style={{ backgroundColor: 'var(--bg-secondary)' }}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-12">
              <div>
                <h2 className="font-display text-3xl sm:text-4xl font-bold mb-3" style={{ color: 'var(--fg-primary)' }}>Featured Properties</h2>
                <p className="text-base" style={{ color: 'var(--fg-secondary)' }}>Hand-picked listings selected for quality and value</p>
              </div>
              <button onClick={() => navigateTo('search')} className="mt-4 sm:mt-0 text-sm font-medium flex items-center gap-2 hover:gap-3 transition-all focus-ring rounded px-2 py-1" style={{ color: 'var(--accent)' }}>View All Properties<span className="transform transition-transform">→</span></button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">{loading ? Array(4).fill(0).map((_, i) => <PropertySkeleton key={i} />) : properties.slice(0, 4).map((property, i) => <PropertyCard key={property._id} property={property} index={i} />)}</div>
          </div>
        </section>
      );
    };

    const PropertyDetail = () => {
      const { selectedProperty, navigateTo, properties, formatPrice } = useApp();
      const [currentImage, setCurrentImage] = useState(0);
      const [showContact, setShowContact] = useState(false);
      const [contactForm, setContactForm] = useState({ name: '', email: '', phone: '', message: '' });
      const [submitStatus, setSubmitStatus] = useState(null);

      const property = selectedProperty || properties.find(p => p._id === selectedProperty?._id) || properties[0];

      // const formatPrice = (price) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'ZMW', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(price);
      const handleContactSubmit = async (e) => { e.preventDefault(); const result = await api.submitContact({ ...contactForm, propertyId: property._id, propertyTitle: property.title }); setSubmitStatus(result); };
      const bedroomLabel = property.bedrooms === 0 ? 'Studio' : `${property.bedrooms} Bedrooms`;

      if (!property) return <div className="min-h-screen flex items-center justify-center"><p style={{ color: 'var(--fg-muted)' }}>Property not found</p></div>;

      return (
        <div className="min-h-screen pt-24 pb-16" style={{ backgroundColor: 'var(--bg-primary)' }}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <button onClick={() => navigateTo('search')} className="flex items-center gap-2 mb-6 text-sm font-medium transition-all hover:gap-3 focus-ring rounded px-2 py-1" style={{ color: 'var(--fg-secondary)' }}><Icons.Arrow /> Back to Results</button>
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              <div className="lg:col-span-2">
                <div className="relative rounded-xl overflow-hidden mb-8 animate-fade-in">
                  <div className="relative h-[300px] sm:h-[450px]"><img src={property.images[currentImage]} alt={property.title} className="w-full h-full object-cover" /></div>
                  {property.images.length > 1 && <div className="absolute bottom-4 left-4 right-4 flex gap-2">{property.images.map((_, i) => <button key={i} onClick={() => setCurrentImage(i)} className={`flex-1 h-1.5 rounded-full transition-all focus-ring ${i === currentImage ? 'opacity-100' : 'opacity-40 hover:opacity-60'}`} style={{ backgroundColor: 'var(--fg-primary)' }} aria-label={`View image ${i + 1}`} />)}</div>}
                  {property.featured && <div className="absolute top-4 left-4 px-4 py-2 rounded-full text-sm font-semibold" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>Featured Listing</div>}
                </div>
                <div className="animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                  <h1 className="font-display text-3xl sm:text-4xl font-bold mb-4" style={{ color: 'var(--fg-primary)' }}>{property.title}</h1>
                  <div className="flex items-center gap-2 mb-6" style={{ color: 'var(--fg-muted)' }}><Icons.Location /><span>{property.location.address}</span><span>•</span><span>{property.location.city}, {property.location.state} {property.location.zipCode}</span></div>
                  <div className="grid grid-cols-4 gap-4 p-5 rounded-xl mb-8" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>
                    {[{ icon: <Icons.Bed />, label: bedroomLabel }, { icon: <Icons.Bath />, label: `${property.bathrooms} Bathrooms` }, { icon: <Icons.Area />, label: `${property.area.toLocaleString()} sqft` }, { icon: null, label: property.propertyType.charAt(0).toUpperCase() + property.propertyType.slice(1) }].map((item, i) => <div key={i} className="text-center">{item.icon && <div className="flex justify-center mb-2" style={{ color: 'var(--accent)' }}>{item.icon}</div>}<span className="text-sm" style={{ color: 'var(--fg-secondary)' }}>{item.label}</span></div>)}
                  </div>
                  <div className="mb-8"><h2 className="font-display text-xl font-semibold mb-4" style={{ color: 'var(--fg-primary)' }}>About This Property</h2><p className="leading-relaxed" style={{ color: 'var(--fg-secondary)' }}>{property.description}</p></div>
                  <div><h2 className="font-display text-xl font-semibold mb-4" style={{ color: 'var(--fg-primary)' }}>Amenities</h2><div className="grid grid-cols-2 sm:grid-cols-3 gap-3">{property.amenities.map((amenity, i) => <div key={i} className="flex items-center gap-2 p-3 rounded-lg" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}><span style={{ color: 'var(--accent)' }}><Icons.Check /></span><span className="text-sm" style={{ color: 'var(--fg-secondary)' }}>{amenity}</span></div>)}</div></div>
                </div>
              </div>
              <div className="lg:col-span-1">
                <div className="sticky top-28 rounded-xl p-6 animate-slide-in-right" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>
                  <div className="mb-6"><span className="font-display text-3xl font-bold" style={{ color: 'var(--accent)' }}>{formatPrice(property.price)}</span><span className="text-base ml-1" style={{ color: 'var(--fg-muted)' }}>/month</span></div>
                  {!showContact ? <button onClick={() => setShowContact(true)} className="w-full py-4 rounded-lg font-semibold text-sm transition-all hover:scale-105 focus-ring mb-4" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>Contact Property</button> : <form onSubmit={handleContactSubmit} className="space-y-4 mb-4"><input type="text" placeholder="Your Name" required value={contactForm.name} onChange={e => setContactForm({ ...contactForm, name: e.target.value })} className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} /><input type="email" placeholder="Email Address" required value={contactForm.email} onChange={e => setContactForm({ ...contactForm, email: e.target.value })} className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} /><input type="tel" placeholder="Phone Number" value={contactForm.phone} onChange={e => setContactForm({ ...contactForm, phone: e.target.value })} className="w-full px-4 py-3 rounded-lg text-sm focus-ring" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }} /><textarea placeholder="Your Message" rows={3} value={contactForm.message} onChange={e => setContactForm({ ...contactForm, message: e.target.value })} className="w-full px-4 py-3 rounded-lg text-sm focus-ring resize-none" style={{ backgroundColor: 'var(--bg-secondary)', color: 'var(--fg-primary)', border: '1px solid var(--border)' }}></textarea>{submitStatus && <div className="p-3 rounded-lg text-sm" style={{ backgroundColor: submitStatus.success ? 'rgba(74, 222, 128, 0.1)' : 'rgba(248, 113, 113, 0.1)', color: submitStatus.success ? 'var(--success)' : 'var(--error)' }}>{submitStatus.message || submitStatus.error}</div>}<button type="submit" className="w-full py-4 rounded-lg font-semibold text-sm transition-all hover:scale-105 focus-ring" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>Send Inquiry</button></form>}
                  <div className="flex items-center justify-center gap-6 pt-4" style={{ borderTop: '1px solid var(--border)' }}><div className="flex items-center gap-2" style={{ color: 'var(--fg-muted)' }}><Icons.Phone /><span className="text-sm">(555) 123-4567</span></div><div className="flex items-center gap-2" style={{ color: 'var(--fg-muted)' }}><Icons.Mail /><span className="text-sm">rentals@homenest.com</span></div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const SearchResults = () => {
      const { searchResults, setSearchResults, isLoading, setIsLoading, lastSearch, setLastSearch, navigateTo, properties } = useApp();
      const [hasSearched, setHasSearched] = useState(false);
      const [showAdvertiseModal, setShowAdvertiseModal] = useState(false);

      const handleSearch = async (filters) => {
        setIsLoading(true); setHasSearched(true);
        const results = await api.searchProperties(filters, properties);
        setSearchResults(results.data); setLastSearch(filters);
        setIsLoading(false);
      };

      return (
        <div className="min-h-screen pt-24 pb-16" style={{ backgroundColor: 'var(--bg-primary)' }}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-6">
              <div>
                <h1 className="font-display text-3xl sm:text-4xl font-bold mb-2" style={{ color: 'var(--fg-primary)' }}>Find Your Rental</h1>
                <p className="text-base" style={{ color: 'var(--fg-secondary)' }}>Browse properties or list your own house for rent.</p>
              </div>
              <button onClick={() => setShowAdvertiseModal(true)} className="px-6 py-3 rounded-lg font-medium text-sm transition-all hover:scale-105 focus-ring flex items-center gap-2" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg> Add Post</button>
            </div>

            <div className="mb-10"><SearchBar variant="results" onSearch={handleSearch} initialValues={lastSearch || {}} /></div>

            {isLoading ? <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">{Array(6).fill(0).map((_, i) => <PropertySkeleton key={i} />)}</div> : searchResults.length > 0 ? <><p className="mb-6 text-sm" style={{ color: 'var(--fg-muted)' }}>{searchResults.length} {searchResults.length === 1 ? 'property' : 'properties'} found</p><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">{searchResults.map((property, i) => <PropertyCard key={property._id} property={property} index={i} />)}</div></> : hasSearched ? <div className="text-center py-20"><div className="text-6xl mb-4">🏠</div><h3 className="font-display text-xl font-semibold mb-2" style={{ color: 'var(--fg-primary)' }}>No Properties Found</h3><p className="mb-6" style={{ color: 'var(--fg-muted)' }}>Try adjusting your search filters to see more results</p><button onClick={() => handleSearch({ location: '', minPrice: '', maxPrice: '', bedrooms: 'any' })} className="px-6 py-3 rounded-lg font-medium text-sm transition-all hover:scale-105 focus-ring" style={{ backgroundColor: 'var(--accent)', color: 'var(--bg-primary)' }}>View All Properties</button></div> : <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">{properties.filter(p => p.available).map((property, i) => <PropertyCard key={property._id} property={property} index={i} />)}</div>}
          </div>
          {showAdvertiseModal && <AdvertisePropertyModal onClose={() => setShowAdvertiseModal(false)} />}
        </div>
      );
    };

    const AboutPage = () => (
      <div className="min-h-screen pt-24 pb-16" style={{ backgroundColor: 'var(--bg-primary)' }}>
        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
          <h1 className="font-display text-4xl sm:text-5xl font-bold mb-8 animate-fade-in-up" style={{ color: 'var(--fg-primary)' }}>About HomeNest</h1>
          <div className="prose prose-lg">
            <p className="text-lg mb-6 animate-fade-in-up stagger-1" style={{ color: 'var(--fg-secondary)' }}>HomeNest is your trusted partner in finding the perfect rental property. We connect renters with verified properties across the nation, making the search for your next home simple and stress-free.</p>
            <div className="p-8 rounded-xl my-10 animate-fade-in-up stagger-2" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)' }}>
              <h2 className="font-display text-2xl font-semibold mb-6" style={{ color: 'var(--fg-primary)' }}>Our Mission</h2>
              <p style={{ color: 'var(--fg-secondary)' }}>We believe everyone deserves a place they can call home. Our mission is to transform the rental experience by providing a transparent, efficient, and user-friendly platform that empowers renters to make informed decisions.</p>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 my-10">
              {[{ number: '12K+', label: 'Active Listings' }, { number: '50+', label: 'Cities Covered' }, { number: '8K+', label: 'Happy Renters' }].map((stat, i) => <div key={i} className="text-center p-6 rounded-xl animate-fade-in-up" style={{ backgroundColor: 'var(--bg-card)', border: '1px solid var(--border)', animationDelay: `${0.3 + i * 0.1}s` }}><div className="font-display text-3xl font-bold mb-2" style={{ color: 'var(--accent)' }}>{stat.number}</div><div className="text-sm" style={{ color: 'var(--fg-muted)' }}>{stat.label}</div></div>)}
            </div>
          </div>
        </div>
      </div>
    );

    const Footer = () => (
      <footer className="py-16 pb-24 sm:pb-16" style={{ backgroundColor: 'var(--bg-secondary)', borderTop: '1px solid var(--border)' }}>
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10">
            <div>
              <div className="flex items-center gap-2 mb-4"><div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{ backgroundColor: 'var(--accent)' }}><span className="font-display text-xl font-bold" style={{ color: 'var(--bg-primary)' }}>H</span></div><span className="font-display text-xl font-semibold" style={{ color: 'var(--fg-primary)' }}>HomeNest</span></div>
              <p className="text-sm" style={{ color: 'var(--fg-muted)' }}>Your trusted partner in finding the perfect rental property.</p>
            </div>
            {[
              { title: 'Quick Links', links: ['Search', 'Featured', 'About', 'Jobs'] },
              { title: 'Property Types', links: ['Apartments', 'Houses', 'Condos', 'Townhouses'] },
              { title: 'Support', links: ['FAQ', 'Privacy Policy', 'Terms of Service', 'Sitemap'] }
            ].map((col, i) => (
              <div key={i}>
                <h4 className="font-semibold mb-4" style={{ color: 'var(--fg-primary)' }}>{col.title}</h4>
                <ul className="space-y-2">{col.links.map((link, j) => <li key={j}><a href="#" className="text-sm transition-colors hover:underline focus-ring rounded px-1" style={{ color: 'var(--fg-muted)' }}>{link}</a></li>)}</ul>
              </div>
            ))}
          </div>
          <div className="mt-12 pt-8 text-center text-sm" style={{ borderTop: '1px solid var(--border)', color: 'var(--fg-muted)' }}>© {new Date().getFullYear()} HomeNest. All rights reserved   POWEREDBY: Mtcode.</div>
        </div>
      </footer>
    );

    const MobileNavBar = () => {
      const { currentPage, navigateTo } = useApp();
      const activeColor = 'var(--accent)';
      const inactiveColor = 'var(--fg-muted)';
      return (
        <nav className="fixed bottom-0 left-0 right-0 z-50 sm:hidden border-t flex justify-around items-center pt-2 pb-5 sm:pb-2" style={{ backgroundColor: 'var(--bg-card)', borderColor: 'var(--border)' }}>
          {[
            { id: 'home', icon: <Icons.Home />, label: 'Home' },
            { id: 'search', icon: <Icons.Search />, label: 'Browse' },
            { id: 'jobs', icon: <Icons.Briefcase />, label: 'Jobs' },
            { id: 'about', icon: <Icons.Info />, label: 'About' }
          ].map(item => (
            <button key={item.id} onClick={() => navigateTo(item.id)} className="flex flex-col items-center gap-1 w-16 focus-ring rounded" aria-label={item.label}>
              <div style={{ color: currentPage === item.id ? activeColor : inactiveColor }}>{item.icon}</div>
              <span className="text-[10px] font-medium" style={{ color: currentPage === item.id ? activeColor : inactiveColor }}>{item.label}</span>
            </button>
          ))}
        </nav>
      );
    };

    const App = () => {
      const { currentPage } = useApp();
      return (
        <div className="min-h-screen flex flex-col">
          <Header />
          <main className="flex-1">
            {currentPage === 'home' && (<><Hero /><FeaturedProperties /></>)}
            {currentPage === 'search' && <SearchResults />}
            {currentPage === 'property' && <PropertyDetail />}
            {currentPage === 'about' && <AboutPage />}
            {currentPage === 'jobs' && <JobsPage />}
            {currentPage === 'login' && <AdminLogin />}
            {currentPage === 'admin-dashboard' && <AdminDashboard />}
          </main>
          <Footer />
          <MobileNavBar />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppProvider><App /></AppProvider>);
  </script>
</body>

</html>
